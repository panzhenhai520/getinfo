    <script>
    // ════════════════════════════════════════════════════════
    //  AI助手 Chat 功能
    // ════════════════════════════════════════════════════════
    // 生成 UUID v4
    function genUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
        });
    }

    const chatState = {
        activeModel: 'deepseek',
        topic: '',
        messages: [],       // [{role, content}]
        isStreaming: false,
        webSearch: false,   // 联网搜索开关
        chatConfig: {},     // 从后端加载的配置
        currentKbId: '',    // 当前知识库 ID（保存后自动填充）
        sessionId: genUUID(), // 当前对话 session ID
    };

    const MODEL_NAMES = {
        kimi: 'Kimi', doubao: '豆包', deepseek: 'DeepSeek', glm52: 'GLM',
        gemini: 'Gemini', chatgpt: 'ChatGPT', claude: 'Claude',
        local: '本地 LLM',
    };
    const CHAT_MODEL_ORDER = ['local', 'glm52', 'kimi', 'doubao', 'deepseek', 'gemini', 'chatgpt', 'claude'];

    // ── Markdown 渲染 ──
    function renderMarkdown(text) {
        if (typeof marked === 'undefined') return escapeHtmlChat(text);
        try {
            marked.setOptions({
                breaks: true,
                gfm: true,
                // 禁止原始 HTML 注入防 XSS
                sanitize: false,
            });
            return marked.parse(text);
        } catch(e) {
            return escapeHtmlChat(text);
        }
    }

    // 文章正文渲染：Markdown 化（图片/标题/列表/链接真正显示）+ 折叠连续空行 + 清洗危险链接
    // 清洗正文：去掉源站面包屑、JS 导航锚点、页头页脚纯链接导航行、空列表标记，并统一压缩连续空行
    function cleanArticleMarkdown(text) {
        return String(text || '').replace(/\r/g, '').split('\n')
            .map(line => line.replace(/\s+$/, ''))
            .filter(line => {
                const t = line.trim();
                if (!t) return true;
                // 面包屑：一行内多个 ">" 且含 Markdown 链接（首页 > 新服务 > ... > 目标）
                if (((t.match(/>/g) || []).length >= 2) && /\]\([^)]*\)/.test(t)) return false;
                // JS 空链接 / 导航锚点
                if (/^\s*\[[^\]]*\]\(javascript:/i.test(t)) return false;
                if (/^\*\s*\[[^\]]+\]\([^)]*javascript:void/i.test(t)) return false;
                // 纯图片行保留（内容）；纯链接行删除（页头页脚导航）
                if (/^\s*(!\[[^\]]*\]\([^)]*\)|\s)+$/.test(t)) return true;
                if (t.replace(/!?\[[^\]]*\]\([^)]*\)/g, '').replace(/[>\s,，→]/g, '') === '') return false;
                // 空列表标记：* / -（非水平线）
                if (/^\s*(?:\*(\s+\*)*|-)\s*$/.test(t)) return false;
                return true;
            }).join('\n').replace(/\n{3,}/g, '\n\n');
    }

    function renderArticleContent(content, matched_keywords) {
        let text = cleanArticleMarkdown(content);
        if (typeof marked === 'undefined') {
            return highlightKeywords(escapeHtml(text), matched_keywords);
        }
        // 匹配关键词：正文里用 <mark class="kw-hl"> 高亮，便于核对匹配位置
        // matched_keywords 可能是字符串/数组/对象，用 getMatchedKeywordTexts 统一取词
        let kws = [];
        try { kws = getMatchedKeywordTexts(matched_keywords); } catch (e) { kws = []; }
        let html;
        try {
            marked.setOptions({ breaks: true, gfm: true, sanitize: false });
            html = marked.parse(text);
        } catch (err) {
            return highlightKeywords(escapeHtml(text), matched_keywords);
        }
        // 清洗：javascript:/data:/vbscript 链接置为 #；去掉 on* 事件
        html = html.replace(/\shref=["'](?:javascript|vbscript|data):[^"']*["']/gi, ' href="#"');
        html = html.replace(/\son\w+\s*=\s*["'][^"']*["']/gi, '');
        // 源站图片防盗链：图片不带 Referer 请求头（该站带 Referer 会返回 403），并懒加载
        html = html.replace(/<img\b([^>]*)>/gi, (m, attrs) => (/referrerpolicy/i.test(attrs) ? m : '<img' + attrs + ' referrerpolicy="no-referrer" loading="lazy">'));
        return highlightInHtml(html, kws);
    }

    // 在渲染后的 HTML 里，把匹配关键词的文本出现处用 <mark class="kw-hl"> 高亮（跳过标签，不破坏结构）
    function highlightInHtml(html, kws) {
        if (!html) return html;
        let output = String(html);
        if (kws && kws.length) {
            const re = new RegExp('(' + kws.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
            output = output.split(/(<[^>]+>)/).map((seg, i) => (i % 2 ? seg : seg.replace(re, '<mark class="kw-hl">$1</mark>'))).join('');
        }
        // 搜索词在正文里同样蓝底高亮（与匹配关键词的 kw-hl 颜色区分）；同样按标签切分，避免
        // 替换到上一步生成的 <mark> 标签属性里。搜索词来源：搜索框 → 会话记忆 → URL。
        try {
            let query = '';
            const box = document.getElementById('searchInput') || document.getElementById('articleSearchInput');
            if (box && box.value) query = String(box.value).trim();
            if (!query) { try { query = String(sessionStorage.getItem('dsh_last_search') || '').trim(); } catch (e) { } }
            if (!query) { const fromUrl = new URLSearchParams(location.search).get('q'); if (fromUrl) query = String(fromUrl).trim(); }
            if (query.length >= 2) {
                const qre = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                output = output.split(/(<[^>]+>)/).map((seg, i) => {
                    if (i % 2) return seg;
                    return seg.replace(qre, '<mark style="background:#38bdf8;color:#06121f;border-radius:3px;padding:0 2px">$1</mark>');
                }).join('');
            }
        } catch (e) { }
        return output;
    }

    function extractGeneratedFileBlocks(text) {
        const blocks = [];
        const pattern = /```file\s+name=["']?([^"'\n]+)["']?(?:\s+type=["']?([^"'\n]+)["']?)?\s*\n([\s\S]*?)```/g;
        let match;
        while ((match = pattern.exec(text || '')) !== null) {
            blocks.push({
                fileName: match[1].trim(),
                mimeType: (match[2] || '').trim(),
                content: match[3].trim(),
            });
        }
        return blocks;
    }

    function renderAssistantContent(node, content) {
        node.innerHTML = renderMarkdown(content || '');
        const blocks = extractGeneratedFileBlocks(content || '');
        if (!blocks.length) return;
        const actions = document.createElement('div');
        actions.className = 'generated-file-actions';
        blocks.forEach(block => {
            const button = document.createElement('button');
            button.type = 'button';
            button.innerHTML = `<i class="fa fa-download"></i><span>生成 ${escapeHtmlChat(block.fileName)}</span>`;
            button.addEventListener('click', () => saveGeneratedChatFile(button, block));
            actions.appendChild(button);
        });
        node.appendChild(actions);
    }

    async function saveGeneratedChatFile(button, block) {
        button.disabled = true;
        button.innerHTML = '<i class="fa fa-spinner fa-spin"></i><span>生成中</span>';
        try {
            const resp = await fetch('/api/chat/files', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    session_id: chatState.sessionId,
                    file_name: block.fileName,
                    mime_type: block.mimeType,
                    content: block.content,
                }),
            });
            const data = await resp.json();
            if (!data.success) throw new Error(data.message || '生成文件失败');
            const link = document.createElement('a');
            link.href = data.file.download_url;
            link.download = data.file.file_name;
            link.innerHTML = `<i class="fa fa-download"></i><span>下载 ${escapeHtmlChat(data.file.file_name)}</span>`;
            button.replaceWith(link);
        } catch (error) {
            button.disabled = false;
            button.innerHTML = '<i class="fa fa-download"></i><span>重新生成</span>';
            alert(error.message || '生成文件失败');
        }
    }

    // ── 联网搜索开关 ──
    function toggleWebSearch() {
        chatState.webSearch = !chatState.webSearch;
        const btn = document.getElementById('chatWebSearchBtn');
        const lbl = document.getElementById('wsLabel');
        if (chatState.webSearch) {
            btn.classList.add('on');
            lbl.textContent = '联网 ✓';
        } else {
            btn.classList.remove('on');
            lbl.textContent = '联网';
        }
    }

    // ── 初始化 ──
    async function initChatConfig() {
        try {
            const res = await fetch('/api/chat/config');
            const d = await res.json();
            if (d.success) {
                chatState.chatConfig = d.config;
                chatState.activeModel = d.config.active_model || 'deepseek';
                renderChatModelSlider();
                updateModelBadge();
                // 缓存 kb_id 供保存对话框使用
                chatState.currentKbId = chatState.currentKbId || d.config.ragflow_kb_id || '';
            }
        } catch(e) {}
    }

    // ── 加载 RAGFlow 知识库列表，填充所有下拉框 ──
    // targetSelIds: 要填充的 select 元素 id 数组；不传则填充所有已知位置
    async function loadKbList(targetSelIds) {
        const selIds = targetSelIds || ['saveDialogKbId', 'kbPanelKbId'];
        // loadKbBtn 已迁移到配置管理页，此处无需操作
        try {
            const res = await fetch('/api/schedule-management/ragflow/datasets?page=1&page_size=50');
            const d = await res.json();
            if (d.success && d.datasets && d.datasets.length > 0) {
                // 缓存列表，供后续使用
                chatState._kbList = d.datasets;
                const savedKb = chatState.chatConfig.ragflow_kb_id || '';
                selIds.forEach(id => {
                    const sel = document.getElementById(id);
                    if (!sel) return;
                    const prev = sel.value; // 尽量保留当前选中值
                    sel.innerHTML = '<option value="">-- 请选择知识库 --</option>';
                    d.datasets.forEach(ds => {
                        const opt = document.createElement('option');
                        opt.value = ds.id || ds.kb_id || '';
                        opt.textContent = `${ds.name || ds.kb_name || opt.value}（${ds.document_count ?? 0}篇）`;
                        sel.appendChild(opt);
                    });
                    // 优先: 上次选中 > 配置默认 > 第一条
                    if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
                    else if (savedKb && [...sel.options].some(o => o.value === savedKb)) sel.value = savedKb;
                    else if (sel.options.length > 1) sel.value = sel.options[1].value;
                });
                void(`已加载 ${d.datasets.length} 个知识库`);
            } else if (!d.configured) {
                void('RAGFlow 未配置');
            } else {
                void(d.error || '暂无知识库');
            }
        } catch(e) {
            void('加载失败: ' + e.message);
        }
        // (no loadKbBtn in chat drawer)
    }

    function updateModelBadge() {
        const badge = document.getElementById('chatModelBadge');
        if (badge) badge.textContent = MODEL_NAMES[chatState.activeModel] || '';
    }

    // ── 开关侧栏 ──
    function openChatDrawer(topic) {
        chatState.topic = topic || '';
        const topicBar = document.getElementById('chatTopicBar');
        if (chatState.topic) {
            topicBar.style.display = 'block';
            document.getElementById('chatTopicLabel').textContent = chatState.topic;
        } else {
            topicBar.style.display = 'none';
        }
        document.getElementById('chatDrawer').classList.add('open');
        document.getElementById('chatOverlay').classList.add('open');
        document.body.style.overflow = 'hidden';

        // 首次打开显示欢迎语；同时生成 session ID
        if (document.getElementById('chatMessages').children.length === 0) {
            chatState.sessionId = genUUID();
            showWelcomeMessage();
        }
        setTimeout(() => document.getElementById('chatInput').focus(), 300);
    }

    function closeChatDrawer() {
        document.getElementById('chatDrawer').classList.remove('open');
        document.getElementById('chatOverlay').classList.remove('open');
        document.body.style.overflow = '';
    }

    // 文章详情弹窗中选中文字 → 引用到AI助手（唤醒右侧聊天抽屉并填入引用）
    // 移动端：点击按钮瞬间手机浏览器会清空选区并弹复制工具条，
    // 因此与首页实现一致——selectionchange 时缓存弹窗内有效选区，点击时回退使用。
    var cachedArticleQuote = '';
    document.addEventListener('selectionchange', function () {
        var modal = document.getElementById('articleModal');
        if (!modal || !modal.classList.contains('active')) return;
        var sel = window.getSelection ? window.getSelection() : null;
        if (!sel || sel.rangeCount < 1) return;
        var range = sel.getRangeAt(0);
        var container = range.commonAncestorContainer;
        if (container.nodeType !== 1) container = container.parentElement;
        if (!modal.contains(container)) return;
        var text = sel.toString().trim();
        if (text) cachedArticleQuote = text;
    });
    (function () {
        var modal = document.getElementById('articleModal');
        if (!modal || !window.MutationObserver) return;
        var observer = new MutationObserver(function () {
            if (!modal.classList.contains('active')) cachedArticleQuote = '';
        });
        observer.observe(modal, { attributes: true, attributeFilter: ['class'] });
    })();
    function quoteToArticleChat(event) {
        if (event) { event.preventDefault(); event.stopPropagation(); }
        var selected = '';
        var sel = window.getSelection ? window.getSelection() : null;
        var modal = document.getElementById('articleModal');
        if (sel && sel.rangeCount > 0 && modal) {
            var range = sel.getRangeAt(0);
            if (modal.contains(range.commonAncestorContainer)) selected = sel.toString().trim();
        }
        selected = selected || cachedArticleQuote;
        cachedArticleQuote = '';   // 引用已消费，清空缓存
        if (!selected) {
            alert('请先在文章正文中选择一段文字，再引用');
            return;
        }
        var titleNode = document.getElementById('modalTitle');
        var title = titleNode ? (titleNode.textContent || '').trim() : '';
        openChatDrawer(title ? ('「' + title + '」') : '');
        var input = document.getElementById('chatInput');
        var draft = input.value.replace(/\s+$/, '');
        input.value = draft ? draft + '\n\n' + selected : selected;
        input.focus();
    }

    function clearChatTopic() {
        chatState.topic = '';
        document.getElementById('chatTopicBar').style.display = 'none';
    }

    function clearChatHistory() {
        chatState.messages = [];
        chatState.sessionId = genUUID(); // 清空时开启新 session
        document.getElementById('chatMessages').innerHTML = '';
        showWelcomeMessage();
    }

    // ── 欢迎消息 ──
    function showWelcomeMessage() {
        const modelName = MODEL_NAMES[chatState.activeModel] || chatState.activeModel;
        const welcome = chatState.topic
            ? `你好，我是时博士助手（${modelName}）。当前话题：「${chatState.topic}」，请提问。`
            : `你好，我是时博士助手（${modelName}）。请提问。`;
        appendAiMessage(welcome, false);
    }

    // ── 模型切换 ──
    function selectChatModel(modelId) {
        chatState.activeModel = modelId;
        renderChatModelSlider();
        updateModelBadge();
        // 保存激活模型到后端
        fetch('/api/chat/config', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({active_model: modelId})});
    }

    function getOrderedChatModels() {
        const models = chatState.chatConfig?.models || {};
        const ordered = CHAT_MODEL_ORDER.filter(modelId => models[modelId]);
        Object.keys(models).forEach(modelId => {
            if (!ordered.includes(modelId)) ordered.push(modelId);
        });
        return ordered;
    }

    function renderChatModelSlider() {
        const slider = document.getElementById('chatModelSlider');
        if (!slider || !chatState.chatConfig) return;
        const models = chatState.chatConfig.models || {};
        const ordered = getOrderedChatModels();
        const activeIndex = Math.max(0, ordered.indexOf(chatState.activeModel));
        const max = Math.max(0, ordered.length - 1);
        const left = ordered.length ? ((activeIndex + 0.5) / ordered.length) * 100 : 50;
        slider.style.setProperty('--model-count', String(Math.max(ordered.length, 1)));
        slider.style.setProperty('--slider-left', `${left}%`);
        slider.innerHTML = `
            <div class="chat-model-icons">
                ${ordered.map(modelId => {
                    const meta = models[modelId] || {};
                    const name = meta.name || MODEL_NAMES[modelId] || modelId;
                    return `<button type="button" class="chat-model-btn ${modelId === chatState.activeModel ? 'active' : ''}" id="mBtn_${modelId}" data-model-id="${modelId}" title="${name} · ${meta.model_id || modelId}">
                        <img src="/static/img/ai/${modelId}.svg" alt="${name}">
                        <span class="chat-model-label">${name}</span>
                    </button>`;
                }).join('')}
            </div>
            <div class="chat-model-rail" aria-hidden="true">
                <div class="chat-model-thumb"><i class="fa fa-chevron-up"></i></div>
                <input class="chat-model-range" type="range" min="0" max="${max}" step="1" value="${activeIndex}" aria-label="切换大模型">
            </div>
        `;
        slider.querySelectorAll('.chat-model-btn').forEach(button => {
            button.addEventListener('click', () => selectChatModel(button.dataset.modelId));
        });
        const input = slider.querySelector('.chat-model-range');
        input?.addEventListener('input', () => {
            const next = ordered[Number(input.value)] || chatState.activeModel;
            selectChatModel(next);
        });
    }

    // ── 辅助：填充知识库下拉框 ──
    function _fillKbSelect(selId, selectedVal) {
        const sel = document.getElementById(selId);
        if (!sel || !chatState._kbList) return;
        const prev = sel.value;
        sel.innerHTML = '<option value="">-- 请选择知识库 --</option>';
        chatState._kbList.forEach(ds => {
            const opt = document.createElement('option');
            opt.value = ds.id || ds.kb_id || '';
            opt.textContent = `${ds.name || ds.kb_name || opt.value}（${ds.document_count ?? 0}篇）`;
            sel.appendChild(opt);
        });
        const pick = selectedVal || prev;
        if (pick && [...sel.options].some(o => o.value === pick)) sel.value = pick;
        else if (sel.options.length > 1) sel.value = sel.options[1].value;
    }

    function appendAiMessage(text, streaming) {
        const container = document.getElementById('chatMessages');

    function escapeHtmlChat(s) {
        return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    function appendFinancialReportLinksArticle(container, reports) {
        const safeReports = (reports || []).filter(item =>
            /^\/api\/financial\/reports\/\d+$/.test(String(item?.report_url || ''))
        );
        if (!safeReports.length) return;
        const reportDiv = document.createElement('div');
        reportDiv.className = 'chat-sources financial-report-actions';
        const title = document.createElement('strong');
        title.textContent = 'TradingAgents 报告：';
        reportDiv.appendChild(title);
        safeReports.forEach(item => {
            const link = document.createElement('a');
            link.href = item.report_url;
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent = `查看终极报告 #${Number(item.report_id)}`;
            reportDiv.appendChild(document.createElement('br'));
            reportDiv.appendChild(link);
        });
        container.appendChild(reportDiv);
    }

    function safeExternalChatUrl(value) {
        try {
            const parsed = new URL(String(value || ''), window.location.origin);
            return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
        } catch (_) {
            return '';
        }
    }

    // ── 发送消息（流式） ──
    async function sendChatMessage() {
        if (chatState.isStreaming) return;
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        autoResizeInput(input);

        chatState.messages.push({role:'user', content: text});
        appendUserMessage(text);

        chatState.isStreaming = true;
        const sendBtn = document.getElementById('chatSendBtn');
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';

        const searchingBar = document.getElementById('chatSearchingBar');
        const aiDiv = appendAiMessage('', true);
        const bubble = aiDiv.querySelector('.chat-bubble-ai');
        let fullResponse = '';
        let errorResponse = '';
        let searchSources = [];
        let reportRefs = [];
        let streamCompleted = false;
        let terminalError = false;
        let financialRouteSeen = false;
        let financialRouteKey = '';
        let reconnectAttempt = 0;

        try {
            const requestPayload = {
                model: chatState.activeModel,
                session_id: chatState.sessionId,
                topic: chatState.topic,
                messages: chatState.messages,
                web_search: chatState.webSearch,
                user_timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                sse_features: ['financial-sse-v1'],
            };
            while (!streamCompleted && !terminalError) {
                const resp = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(requestPayload),
                });
                if (!resp.ok || !resp.body) throw new Error(`聊天接口异常：${resp.status}`);
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';

                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, {stream:true});
                    const lines = buf.split('\n');
                    buf = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith('data:')) continue;
                        const data_str = line.slice(5).trim();
                        try {
                            const ev = JSON.parse(data_str);
                            if (streamCompleted && ev.type !== 'done') continue;
                            if (ev.type === 'searching') {
                            // 显示搜索中指示条
                            document.getElementById('chatSearchingMsg').textContent = ev.message;
                            searchingBar.classList.add('visible');
                            } else if (ev.type === 'status') {
                            const msg = ev.message || '正在等待模型响应...';
                            document.getElementById('chatSearchingMsg').textContent = msg;
                            if (!fullResponse) {
                                searchingBar.classList.add('visible');
                                bubble.textContent = msg;
                            }
                            } else if (ev.type === 'route') {
                                financialRouteSeen = true;
                                financialRouteKey = ev.request_id || financialRouteKey;
                                const msg = `已路由到金融能力：${ev.route_destination || ev.intent || '金融研究'}`;
                                document.getElementById('chatSearchingMsg').textContent = msg;
                                searchingBar.classList.add('visible');
                            } else if (ev.type === 'clarification' || ev.type === 'research_status') {
                                financialRouteSeen = true;
                                const msg = ev.message || ev.question || '正在处理金融研究';
                                document.getElementById('chatSearchingMsg').textContent = msg;
                                searchingBar.classList.add('visible');
                                if (!fullResponse) bubble.textContent = msg;
                            } else if (ev.type === 'sources') {
                                financialRouteSeen = true;
                                searchSources = (ev.sources || []).filter(item => item.url).map(item => ({
                                    href: item.url,
                                    title: item.title || item.provider || item.url,
                                }));
                            } else if (ev.type === 'report_ready') {
                                financialRouteSeen = true;
                                reportRefs = ev.reports || [];
                            } else if (ev.type === 'search_done') {
                            searchingBar.classList.remove('visible');
                            searchSources = ev.snippets || [];
                            } else if (ev.type === 'chunk') {
                            searchingBar.classList.remove('visible');
                            fullResponse += ev.content;
                            // 流式阶段也实时渲染 Markdown，避免显示 **、## 等源码符号。
                            bubble.classList.add('streaming');
                            renderAssistantContent(bubble, fullResponse);
                            scrollChatBottom();
                            } else if (ev.type === 'done') {
                            if (streamCompleted) continue;
                            streamCompleted = true;
                            bubble.classList.remove('streaming');
                            bubble.style.whiteSpace = 'normal';
                            // 流式完成后渲染 Markdown
                            renderAssistantContent(bubble, fullResponse);
                            // 若有搜索来源，追加引用卡片
                            if (searchSources.length) {
                                const srcDiv = document.createElement('div');
                                srcDiv.className = 'chat-sources';
                                const label = document.createElement('strong');
                                label.textContent = '参考来源：';
                                srcDiv.appendChild(label);
                                searchSources.forEach((source, index) => {
                                    const href = safeExternalChatUrl(source.href);
                                    if (!href) return;
                                    const link = document.createElement('a');
                                    link.href = href;
                                    link.target = '_blank';
                                    link.rel = 'noopener';
                                    link.textContent = `[${index + 1}] ${source.title || href}`;
                                    srcDiv.appendChild(document.createElement('br'));
                                    srcDiv.appendChild(link);
                                });
                                aiDiv.appendChild(srcDiv);
                            }
                            scrollChatBottom();
                            } else if (ev.type === 'error') {
                            searchingBar.classList.remove('visible');
                            bubble.classList.remove('streaming');
                            bubble.innerHTML = `<span style="color:#dc2626;"><i class="fa fa-exclamation-triangle mr-1"></i>${escapeHtmlChat(ev.message)}</span>`;
                            errorResponse = ev.message || '聊天生成失败';
                            fullResponse = '';
                            terminalError = true;
                            }
                            // Unknown optional events are intentionally ignored.
                        } catch(e2) {}
                    }
                }
                if (!streamCompleted && !terminalError && financialRouteSeen && reconnectAttempt < 1) {
                    reconnectAttempt += 1;
                    fullResponse = '';
                    reportRefs = [];
                    bubble.textContent = '金融数据流连接中断，正在恢复...';
                    document.getElementById('chatSearchingMsg').textContent = '金融数据流连接中断，正在恢复...';
                    searchingBar.classList.add('visible');
                    continue;
                }
                if (!streamCompleted && !terminalError) {
                    throw new Error('聊天数据流连接中断，未收到完成标记');
                }
            }
            bubble.classList.remove('streaming');
            bubble.style.whiteSpace = 'normal';
            if (streamCompleted && fullResponse && !bubble.querySelector('p,h1,h2,h3,ul,ol,pre')) {
                renderAssistantContent(bubble, fullResponse);
            }
            if (streamCompleted) appendFinancialReportLinksArticle(aiDiv, reportRefs);
        } catch(e) {
            searchingBar.classList.remove('visible');
            bubble.classList.remove('streaming');
            bubble.innerHTML = `<span style="color:#dc2626;"><i class="fa fa-exclamation-triangle mr-1"></i>请求失败: ${escapeHtmlChat(e.message)}</span>`;
            errorResponse = `请求失败: ${e.message}`;
            fullResponse = '';
        }

        if (fullResponse) {
            // 追加 AI 回复到历史
            chatState.messages.push({role:'assistant', content: fullResponse});
            // 自动保存到 SQLite 历史记录
            autoSaveChatHistory(text, fullResponse, financialRouteKey);
        } else if (errorResponse) {
            const savedError = `错误：${errorResponse}`;
            chatState.messages.push({role:'assistant', content: savedError});
            autoSaveChatHistory(text, savedError, financialRouteKey);
        }

        chatState.isStreaming = false;
        sendBtn.disabled = false;
        sendBtn.innerHTML = '<i class="fa fa-paper-plane"></i>';
        scrollChatBottom();
    }

    // ── 保存对话到知识库（选择面板） ──
    function openSaveToKbDialog() {
        const pairs = [];
        const msgs = chatState.messages;
        for (let i = 0; i < msgs.length - 1; i++) {
            if (msgs[i].role === 'user' && msgs[i+1].role === 'assistant') {
                pairs.push({q: msgs[i].content, a: msgs[i+1].content});
            }
        }
        if (!pairs.length) { alert('暂无可保存的对话内容'); return; }

        // 填充对话列表
        const list = document.getElementById('chatSaveList');
        list.innerHTML = pairs.map((p, idx) => `
            <label class="chat-save-item">
                <input type="checkbox" class="save-item-chk" data-idx="${idx}" checked>
                <div class="chat-save-item-text">
                    <div class="chat-save-item-q">问：${escapeHtmlChat(p.q.slice(0,80))}${p.q.length>80?'…':''}</div>
                    <div class="chat-save-item-a">答：${escapeHtmlChat(p.a.slice(0,120))}${p.a.length>120?'…':''}</div>
                </div>
            </label>`).join('');
        list._pairs = pairs;
        document.getElementById('saveSelectAll').checked = true;

        // 填充知识库下拉框
        if (chatState._kbList) {
            _fillKbSelect('saveDialogKbId', chatState.currentKbId || chatState.chatConfig.ragflow_kb_id || '');
        } else {
            loadKbList(['saveDialogKbId', 'kbPanelKbId']);
        }
        // 默认使用通用文档解析，避免按问答切分
        document.getElementById('saveDialogMethod').value = 'naive';

        document.getElementById('chatSaveDialog').classList.add('open');
    }

    function closeSaveToKbDialog() {
        document.getElementById('chatSaveDialog').classList.remove('open');
    }

    function toggleSelectAll(cb) {
        document.querySelectorAll('.save-item-chk').forEach(c => c.checked = cb.checked);
    }

    async function confirmSaveToKb() {
        const list = document.getElementById('chatSaveList');
        const pairs = list._pairs || [];
        const selected = [...document.querySelectorAll('.save-item-chk:checked')].map(c => pairs[+c.dataset.idx]);
        if (!selected.length) { alert('请至少选择一条对话'); return; }

        const kbId = document.getElementById('saveDialogKbId').value.trim();
        if (!kbId) { alert('请选择目标知识库'); return; }
        const method = document.getElementById('saveDialogMethod').value || 'naive';

        const btn = document.getElementById('saveToKbBtn');
        btn.textContent = '上传解析中…'; btn.disabled = true;
        const modelName = MODEL_NAMES[chatState.activeModel] || chatState.activeModel;
        const topic = chatState.topic || (selected[0]?.q || 'AI助手问答').slice(0, 40);
        try {
            const res = await fetch('/api/chat/save-qa-batch', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({
                    pairs: selected,
                    topic,
                    model_name: modelName,
                    kb_id: kbId,
                    chunk_method: method || 'naive',
                })
            });
            const d = await res.json();
            if (!d.success) throw new Error(d.message || '上传解析失败');
            btn.textContent = '加入知识库';
            btn.disabled = false;
            closeSaveToKbDialog();
            chatState.currentKbId = kbId;
            setTimeout(() => openChatKbPanel(kbId), 200);
        } catch (error) {
            btn.textContent = '加入知识库';
            btn.disabled = false;
            alert('加入知识库失败: ' + error.message);
        }
    }

    // ── 知识库文档管理面板 ──
    const CHUNK_METHOD_LABELS = {naive:'General / 通用', qa:'问答(Q&A)', manual:'手动', paper:'论文', book:'书籍', laws:'法规', one:'整文档', table:'表格', email:'邮件'};
    const RUN_STATUS = {DONE:{cls:'done',txt:'已解析'}, RUNNING:{cls:'running',txt:'解析中'}, UNSTART:{cls:'unstart',txt:'未解析'}, FAIL:{cls:'fail',txt:'失败'}};

    function openChatKbPanel(kbId) {

    }

    async function loadKbDocPanel() {
        const kbId = chatState.currentKbId || '';
        const listEl = document.getElementById('kbDocList');
        const totalEl = document.getElementById('kbPanelTotal');
        listEl.innerHTML = '<div style="color:#9ca3af;font-size:12px;padding:8px;">加载中…</div>';
        try {
            const res = await fetch(`/api/chat/kb-documents?kb_id=${encodeURIComponent(kbId)}&page=1&page_size=30`);
            const d = await res.json();
            if (!d.success) { listEl.innerHTML = `<div style="color:#dc2626;font-size:12px;padding:8px;">${d.message}</div>`; return; }
            const docs = d.docs || [];
            totalEl.textContent = `共 ${d.total} 个文档（显示前30条）`;
            chatState.currentKbId = d.kb_id;
            if (!docs.length) { listEl.innerHTML = '<div style="color:#9ca3af;font-size:12px;padding:8px;">暂无文档</div>'; return; }
            listEl.innerHTML = docs.map(doc => {
                const run   = doc.run || 'UNSTART';
                const st    = RUN_STATUS[run] || {cls:'unstart', txt:run};
                const meth  = doc.chunk_method || 'naive';
                const opts  = Object.entries(CHUNK_METHOD_LABELS).map(([v,l]) =>
                    `<option value="${v}"${v===meth?' selected':''}>${l}</option>`).join('');
                return `<div class="kb-doc-row" data-id="${doc.id}">
                    <input type="checkbox" class="kb-doc-chk" data-id="${doc.id}" checked style="flex-shrink:0;cursor:pointer;">
                    <span class="kb-doc-name" title="${escapeHtmlChat(doc.name||'')}">${escapeHtmlChat((doc.name||'').slice(0,40))}</span>
                    <span class="kb-doc-status ${st.cls}">${st.txt}</span>
                    <select class="kb-parse-select" onchange="updateDocMethod('${doc.id}',this.value)">${opts}</select>
                    <button class="kb-parse-btn" onclick="parseSingleDoc('${doc.id}',this)">解析</button>
                    <button class="kb-del-btn" onclick="deleteSingleDoc('${doc.id}',this)"><i class="fa fa-trash"></i></button>
                </div>`;
            }).join('');
        } catch(e) {
            listEl.innerHTML = `<div style="color:#dc2626;font-size:12px;padding:8px;">加载失败: ${e.message}</div>`;
        }
    }

    async function updateDocMethod(docId, method) {
        const kbId = chatState.currentKbId;
        await fetch('/api/chat/kb-parse', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({kb_id:kbId, doc_ids:[docId], chunk_method:method})});
    }

    async function parseSingleDoc(docId, btn) {
        const kbId = chatState.currentKbId;
        const row  = btn.closest('.kb-doc-row');
        const method = row ? row.querySelector('.kb-parse-select').value : '';
        btn.textContent = '解析中…'; btn.disabled = true;
        try {
            const res = await fetch('/api/chat/kb-parse', {method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({kb_id:kbId, doc_ids:[docId], chunk_method:method})});
            const d = await res.json();
            btn.textContent = d.success ? '已触发' : '失败';
            setTimeout(() => { btn.textContent='解析'; btn.disabled=false; loadKbDocPanel(); }, 2000);
        } catch { btn.textContent='失败'; btn.disabled=false; }
    }

    async function parseSelectedKbDocs() {
        const kbId   = chatState.currentKbId;
        const method = document.getElementById('kbBatchMethod').value;
        const ids    = [...document.querySelectorAll('.kb-doc-chk:checked')].map(c => c.dataset.id);
        if (!ids.length) { alert('请先勾选要解析的文档'); return; }
        const res = await fetch('/api/chat/kb-parse', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({kb_id:kbId, doc_ids:ids, chunk_method:method})});
        const d = await res.json();
        alert(d.success ? `已触发 ${ids.length} 个文档解析` : `失败: ${d.message}`);
        if (d.success) setTimeout(loadKbDocPanel, 1500);
    }

    async function deleteSingleDoc(docId, btn) {
        if (!confirm('确认删除此文档？')) return;
        const kbId = chatState.currentKbId;
        btn.disabled = true;
        try {
            const res = await fetch('/api/chat/kb-documents', {method:'DELETE', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({kb_id:kbId, doc_ids:[docId]})});
            const d = await res.json();
            if (d.success) btn.closest('.kb-doc-row').remove();
            else alert('删除失败: ' + d.message);
        } catch(e) { btn.disabled=false; }
    }

        const detailEl = document.getElementById('histSessionDetail');

        detailEl.innerHTML = '<div style="color:#9ca3af;font-size:12px;padding:12px;">加载中…</div>';

            const d = await res.json();
            const msgs = d.messages || [];
            _histCurrentSession = {sessionId, messages: msgs, modelId: d.model_id};
            if (!msgs.length) {
                detailEl.innerHTML = '<div style="color:#9ca3af;font-size:12px;padding:12px;">暂无内容</div>';
                return;
            }
            // 将消息分组为 Q&A 对
            const pairs = [];
            for (let i = 0; i < msgs.length - 1; i++) {
                if (msgs[i].role === 'user' && msgs[i+1].role === 'assistant') {
                    pairs.push({id: msgs[i].id, q: msgs[i].content, a: msgs[i+1].content});
                }
            }
            detailEl.innerHTML = `
                <div style="font-size:11px;color:#6b7280;margin-bottom:8px;">
                    ${MODEL_NAMES[d.model_id]||d.model_id||''}
                    ${d.topic ? ' · 话题：'+escapeHtmlChat(d.topic) : ''}
                    · 共 ${pairs.length} 条问答
                    <label style="float:right;cursor:pointer;display:flex;align-items:center;gap:4px;">
                        <input type="checkbox" id="histSelectAll" onchange="histToggleAll(this)"> 全选
                    </label>
                </div>
                ${pairs.map((p, idx) => `
                    <div class="hist-msg-block" style="position:relative;">
                        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;">
                            <input type="checkbox" class="hist-qa-chk" data-idx="${idx}" checked
                                style="flex-shrink:0;margin-top:3px;cursor:pointer;">
                            <div style="flex:1;min-width:0;">
                                <div class="hist-msg-block user-block" style="margin-bottom:4px;">
                                    <div class="hist-msg-label">问</div>
                                    <div class="hist-msg-text">${escapeHtmlChat(p.q)}</div>
                                </div>
                                <div class="hist-msg-block ai-block">
                                    <div class="hist-msg-label">答</div>
                                    <div class="hist-msg-text">${renderMarkdown(p.a)}</div>
                                </div>
                            </div>
                        </label>
                    </div>`).join('')}
            `;
            detailEl._pairs = pairs;
        } catch(e) {
            detailEl.innerHTML = `<div style="color:#dc2626;font-size:12px;padding:12px;">加载失败: ${e.message}</div>`;
        }
    }

    function histToggleAll(cb) {
        document.querySelectorAll('.hist-qa-chk').forEach(c => c.checked = cb.checked);
    }

    function histBackToList() {
        _histCurrentSession = null;
        loadHistSessions();
    }

    // 将历史 session 的消息恢复到当前对话窗口
    function histRestoreSession() {
        if (!_histCurrentSession) return;
        const msgs = _histCurrentSession.messages;
        if (!msgs.length) return;
        chatState.messages = [];
        chatState.sessionId = _histCurrentSession.sessionId; // 继续同一 session
        document.getElementById('chatMessages').innerHTML = '';
        msgs.forEach(m => {
            chatState.messages.push({role: m.role, content: m.content});
            if (m.role === 'user') {
                appendUserMessage(m.content);
            } else if (m.role === 'assistant') {
                const aiDiv = appendAiMessage('', false);
                const bubble = aiDiv.querySelector('.chat-bubble-ai');
                if (bubble) bubble.innerHTML = renderMarkdown(m.content);
            }
        });
        closeChatHistoryPanel();
        scrollChatBottom();
    }

    // 将选中的历史 Q&A 保存到知识库 — 先弹选择对话框
    function histSaveSelectedToKb() {
        const detailEl = document.getElementById('histSessionDetail');
        const pairs = detailEl._pairs || [];
        const selected = [...document.querySelectorAll('.hist-qa-chk:checked')].map(c => pairs[+c.dataset.idx]);
        if (!selected.length) { alert('请至少勾选一条问答'); return; }

        // 复用主保存对话框：填入选中内容后打开
        const list = document.getElementById('chatSaveList');
        list.innerHTML = selected.map((p, idx) => `
            <label class="chat-save-item">
                <input type="checkbox" class="save-item-chk" data-idx="${idx}" checked>
                <div class="chat-save-item-text">
                    <div class="chat-save-item-q">问：${escapeHtmlChat(p.q.slice(0,80))}${p.q.length>80?'…':''}</div>
                    <div class="chat-save-item-a">答：${escapeHtmlChat(p.a.slice(0,120))}${p.a.length>120?'…':''}</div>
                </div>
            </label>`).join('');
        list._pairs = selected;
        document.getElementById('saveSelectAll').checked = true;
        if (chatState._kbList) {
            _fillKbSelect('saveDialogKbId', chatState.currentKbId || chatState.chatConfig.ragflow_kb_id || '');
        } else {
            loadKbList(['saveDialogKbId', 'kbPanelKbId']);
        }
        document.getElementById('saveDialogMethod').value = 'naive';
        closeChatHistoryPanel();
        document.getElementById('chatSaveDialog').classList.add('open');
    }

    async function deleteHistSession(sessionId, btn) {
        if (!confirm('确认删除此会话的所有记录？')) return;
        btn.disabled = true;
        try {
            const res = await fetch(`/api/chat/history/session/${sessionId}`, {method:'DELETE'});
            const d = await res.json();
            if (d.success) {
                btn.closest('.hist-session-item').remove();
            } else {
                alert('删除失败: ' + d.message);
                btn.disabled = false;
            }
        } catch(e) { btn.disabled = false; }
    }

    // ── 键盘快捷键 ──
    function handleChatKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
    }

    function autoResizeInput(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    // 初始化
    initChatConfig();
    </script>

    <!-- 文章内容查看模态框 -->
    <div id="articleModal" class="article-modal">
        <div class="article-modal-content">
            <div class="article-modal-header" style="position:absolute;top:8px;right:10px;background:transparent;border:0;padding:0;z-index:6;justify-content:flex-end">
                <button onclick="closeArticleModal()" class="article-modal-close" aria-label="关闭"><i class="fa fa-times"></i></button>
            </div>
            
            <div class="article-modal-body">
                <!-- 文章元信息 -->
                <div class="article-meta">
                    <div class="article-meta-item full article-meta-title" style="display:block;margin:0 0 8px">
                        <div class="article-meta-value" id="modalTitle" style="font-size:20px;font-weight:800;color:#111827;line-height:1.35">-</div>
                    </div>
                    <div class="article-meta-item">
                        <div class="article-meta-label">
                            <i class="fa fa-link mr-1"></i> URL
                        </div>
                        <div class="article-meta-value">
                            <a id="modalUrl" href="#" target="_blank" class="text-blue-600 hover:underline">-</a>
                        </div>
                    </div>
                    <div class="article-meta-item">
                        <div class="article-meta-label">
                            <i class="fa fa-calendar mr-1"></i> 发布日期
                        </div>
                        <div class="article-meta-value" id="modalDate">-</div>
                    </div>
                    <div class="article-meta-item">
                        <div class="article-meta-label">
                            <i class="fa fa-building mr-1"></i> 网站名称
                        </div>
                        <div class="article-meta-value" id="modalSiteName">-</div>
                    </div>
                    <div class="article-meta-item">
                        <div class="article-meta-label">
                            <i class="fa fa-globe mr-1"></i> 来源
                        </div>
                        <div class="article-meta-value" id="modalDomain">-</div>
                    </div>
                    <div class="article-meta-item">
                        <div class="article-meta-label">
                            <i class="fa fa-clock mr-1"></i> 聚合时间
                        </div>
                        <div class="article-meta-value" id="modalCrawlTime">-</div>
                    </div>
                    <div class="article-meta-item">
                        <div class="article-meta-label">
                            <i class="fa fa-tag mr-1"></i> 匹配关键词
                        </div>
                        <div class="article-meta-value" id="modalKeywords">-</div>
                    </div>
                </div>
                
                <!-- 对照阅读：原文固定在左，译文固定在右 -->
                <div id="articleReadingColumns" class="article-reading-columns">
                    <section class="article-reading-panel">
                        <h4 class="font-bold text-gray-700 mb-3 flex items-center justify-between"><span></span><span><button type="button" id="speakSourceBtn" class="article-speech-action" style="display:none" onclick="speakArticle('source')"><i class="fa fa-volume-up"></i> 朗读原文</button><span id="speechBufferWave" class="speech-buffer-wave" hidden aria-live="polite"><span>预缓存 0/3</span></span><span class="text-sm text-gray-500" id="modalContentLength">0 字符</span></span></h4>
                        <div id="modalContent" class="article-content-display bg-white border border-gray-200 rounded-lg p-3">正在加载...</div>
                    </section>
                    <section id="translationReadingPanel" class="article-reading-panel translation-reading-panel">
                        <h4 class="article-reading-panel-heading"><span><i class="fa fa-language mr-2"></i>译文</span><span><button type="button" id="speakTranslationBtn" class="article-speech-action" style="display:none" onclick="speakArticle('translation')"><i class="fa fa-volume-up"></i> 朗读译文</button><span id="translationProgress">等待翻译</span></span></h4>
                        <div id="modalTranslation" class="article-content-display bg-white border border-gray-200 rounded-lg p-4">等待翻译...</div>
                    </section>
                </div>
            </div>
            
            <div class="article-modal-footer">
                <button type="button" onclick="quoteToArticleChat(event)" class="article-modal-action is-secondary btn-sm bg-gray-500 text-white rounded hover:bg-gray-600 transition-colors" title="将选中的文章内容引用到AI助手"><i class="fa fa-quote-left mr-1"></i>引用到AI助手</button><button id="modalTranslateBtn" onclick="translateModalArticle()" style="display:none" class="article-modal-action is-translate modal-translate-action" title="Translate / 翻译" aria-label="Translate / 翻译"><span class="translation-mark" aria-hidden="true"><b>EN</b><i>⇄</i><b>中</b></span></button><button type="button" onclick="stopArticleSpeech()" style="display:none" class="article-modal-action is-secondary btn-sm bg-gray-500 text-white rounded hover:bg-gray-600 transition-colors"><i class="fa fa-stop mr-1"></i>停止朗读</button><button type="button" onclick="shareCurrentArticle(this)" class="article-modal-action is-secondary btn-sm bg-gray-500 text-white rounded hover:bg-gray-600 transition-colors" title="分享文章给微信好友"><i class="fa fa-share-alt mr-1"></i>分享</button><button onclick="closeArticleModal()" class="article-modal-action is-secondary btn-sm bg-gray-500 text-white rounded hover:bg-gray-600 transition-colors">
                    <i class="fa fa-times mr-1"></i>关闭
                </button>
            </div>
        </div>
    </div>
    
</body>
