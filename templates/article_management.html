<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聚合结果 - {{ platform_name }}</title>
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/fontawesome.css">
    <link rel="stylesheet" href="/static/css/dashboard-theme.css">
    <style>
        .primary { color: #1d7f68; }
        .text-primary { color: #1d7f68 !important; }
        .bg-primary { background-color: #1d7f68; }
        .hover\:bg-primary:hover { background-color: #15624f; }
        .hover\:bg-primary\/90:hover { background-color: #15624f; }
        .hover\:text-primary\/80:hover { color: #15624f !important; }
        
        /* 卡片阴影 */
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        /* 渐变背景样式 */
        .gradient-bg {
            background: linear-gradient(135deg, #1d7f68 0%, #15624f 100%);
        }
        
        /* 文字颜色 */
        .text-dark { color: #1e293b; }

        .article-management-panel {
            border: 1px solid #e5e7eb;
        }

        .article-filter-panel {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            position: sticky;
            top: 64px;
            z-index: 30;
            box-shadow: 0 4px 12px rgba(0,0,0,.04);
            backdrop-filter: blur(4px);
        }

        .skeleton-line {
            border-radius: 4px;
            background: linear-gradient(90deg,#eef1f4 25%,#e2e8ef 37%,#eef1f4 63%);
            background-size: 400% 100%;
            animation: skeletonShimmer 1.4s ease infinite;
        }
        @keyframes skeletonShimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

        .article-filter-grid {
            display: grid;
            grid-template-columns: minmax(240px, 1fr) auto;
            gap: 8px;
            align-items: center;
        }

        .filter-control {
            width: 100%;
            min-height: 34px;
            padding: 7px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #111827;
            font-size: 12px;
            outline: none;
        }

        .filter-control:focus {
            border-color: #1d7f68;
            box-shadow: 0 0 0 2px rgba(29, 127, 104, 0.14);
        }

        .search-control {
            padding-left: 30px;
        }

        .article-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
            align-items: center;
        }

        .keyword-map-panel {
            position: relative;
            z-index: 1;
            overflow: visible;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
            padding: 12px;
            margin-bottom: 10px;
        }

        .keyword-map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .keyword-map-grid {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 18px;
            min-height: 260px;
            padding: 18px 8px;
            border-radius: 8px;
            overflow: visible;
            background:
                radial-gradient(circle at 20% 20%, rgba(29, 127, 104, 0.10), transparent 26%),
                radial-gradient(circle at 80% 30%, rgba(215, 155, 70, 0.10), transparent 24%),
                #f9fbf8;
        }

        .keyword-node {
            width: var(--bubble-size, 112px);
            height: var(--bubble-size, 112px);
            min-width: var(--bubble-size, 112px);
            border: 1px solid rgba(29, 127, 104, 0.26);
            border-radius: 999px;
            background: radial-gradient(circle at 35% 28%, #ffffff 0%, #dfe9e4 48%, #9fc7ba 100%);
            padding: 12px;
            text-align: center;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: visible;
            transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
            position: relative;
            z-index: 1;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .keyword-node-wrap {
            position: relative;
            display: inline-flex;
            overflow: visible;
        }

        .keyword-node.dragging {
            cursor: grabbing;
            z-index: 120;
            opacity: 0.9;
            box-shadow: 0 22px 46px rgba(15, 23, 42, 0.26);
            transition: none;
        }

        .keyword-node.merge-target {
            transform: scale(1.18);
            border-color: #0f766e;
            box-shadow: 0 0 0 7px rgba(15, 118, 110, 0.18), 0 22px 44px rgba(15, 23, 42, 0.22);
            z-index: 90;
        }

        .keyword-node.merge-absorbing {
            animation: keywordAbsorb 0.28s ease forwards;
        }

        .keyword-node.merge-source {
            border-color: #d97706;
            box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.16), 0 14px 32px rgba(15, 23, 42, 0.16);
        }

        .keyword-node:hover {
            transform: translateY(-2px) scale(1.03);
            border-color: #1d7f68;
            box-shadow: 0 12px 28px rgba(29, 127, 104, 0.18);
            z-index: 40;
        }

        .keyword-node.merge-target:hover {
            transform: scale(1.18);
            border-color: #0f766e;
            box-shadow: 0 0 0 7px rgba(15, 118, 110, 0.18), 0 22px 44px rgba(15, 23, 42, 0.22);
            z-index: 90;
        }

        .keyword-node.active {
            border-color: #15624f;
            background: radial-gradient(circle at 35% 28%, #ffffff 0%, #c8ddd5 42%, #1d7f68 100%);
            box-shadow: 0 0 0 3px rgba(29, 127, 104, 0.16), 0 14px 32px rgba(29, 127, 104, 0.22);
        }

        .keyword-node-name {
            color: #1e293b;
            font-size: var(--bubble-label-size, 14px);
            font-weight: 700;
            line-height: 1.25;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 92%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .keyword-node-float {
            position: absolute;
            left: calc(100% - 8px);
            top: 50%;
            z-index: 60;
            min-width: 116px;
            transform: translate(10px, -50%);
            padding: 7px 9px;
            border: 1px solid rgba(29, 127, 104, 0.24);
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.16);
            color: #475569;
            font-size: 11px;
            line-height: 1.45;
            text-align: left;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.14s ease, transform 0.14s ease, visibility 0.14s ease;
        }

        .keyword-node-float strong {
            display: block;
            color: #15624f;
            font-size: 13px;
            line-height: 1.3;
        }

        .keyword-node:hover .keyword-node-float,
        .keyword-node:focus-visible .keyword-node-float {
            opacity: 1;
            visibility: visible;
            transform: translate(0, -50%);
        }

        @keyframes keywordAbsorb {
            to {
                opacity: 0;
                transform: scale(0.24);
            }
        }

        .keyword-context-menu {
            position: fixed;
            z-index: 3000;
            display: none;
            min-width: 176px;
            padding: 6px;
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
        }

        .keyword-context-menu.active {
            display: block;
        }

        .keyword-context-title {
            max-width: 220px;
            padding: 6px 8px 7px;
            color: #334155;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 4px;
        }

        .keyword-context-item {
            width: 100%;
            min-height: 32px;
            padding: 0 9px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
        }

        .keyword-context-item:hover {
            background: #f1f5f9;
            color: #0f766e;
        }

        .keyword-context-item.danger {
            color: #b91c1c;
        }

        .keyword-context-item.danger:hover {
            background: #fef2f2;
            color: #991b1b;
        }

        .keyword-selected-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 10px;
            background: rgba(29, 127, 104, 0.10);
            border: 1px solid rgba(29, 127, 104, 0.22);
            border-radius: 8px;
            margin-bottom: 8px;
            color: #15624f;
            font-size: 12px;
            font-weight: 700;
        }

        .keyword-selected-bar.active {
            display: flex;
        }

        .compact-action-btn {
            min-height: 34px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .compact-action-btn.primary-action {
            background: #1d7f68;
            color: #fff;
        }

        .compact-action-btn.primary-action:hover {
            background: #15624f;
        }

        .compact-action-btn.success-action {
            background: #ecfdf5;
            border-color: #bbf7d0;
            color: #047857;
        }

        .compact-action-btn.success-action:hover {
            background: #d1fae5;
            border-color: #86efac;
        }

        .compact-action-btn.danger-action {
            background: #fef2f2;
            border-color: #fecaca;
            color: #b91c1c;
        }

        .compact-action-btn.danger-action:hover {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .keyword-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        .keyword-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            max-width: 132px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid transparent;
            font-size: 10px;
            line-height: 1.3;
            font-weight: 600;
            overflow: hidden;
            white-space: nowrap;
        }
        .keyword-badge > span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .keyword-badge-title {
            background: #fffbeb;
            border-color: #fde68a;
            color: #92400e;
        }

        .keyword-badge-content {
            background: rgba(29, 127, 104, 0.10);
            border-color: rgba(29, 127, 104, 0.24);
            color: #15624f;
        }

        .keyword-badge-unknown {
            background: #f3f4f6;
            border-color: #e5e7eb;
            color: #4b5563;
        }

        .keyword-empty {
            color: #9ca3af;
            font-size: 12px;
        }

        .article-list-header,
        .article-list-row {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) minmax(160px, 220px) 96px;
            gap: 10px;
            align-items: center;
        }

        .article-list-header {
            padding: 8px 10px;
            background: #f8fafc;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            border-bottom: 1px solid #e5e7eb;
        }

        /* 列表行：悬停高亮与标题/网址层级（深色皮肤下由 _dashboard_nav.html 覆盖配色） */
        .article-list-item:hover { background: #f8fafc; }
        .article-list-title {
            font-size: 15px;
            font-weight: 600;
            color: #111827;
            line-height: 1.45;
        }
        /* 标题下方一行（网址/日期/字数）：字号更小、颜色更淡，让标题突出 */
        .article-list-meta {
            font-size: 12px;
            color: #9ca3af;
        }

        /* 主题聚合页（如【竞争情报】）的配置关键词：命中项高亮，未命中项淡化 */
        .article-theme-kws { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 7px; }
        .article-theme-kw {
            font-size: 11px;
            line-height: 1.6;
            padding: 1px 8px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.16);
            color: #94a3b8;
        }
        .article-theme-kw.is-hit {
            background: rgba(29, 127, 104, 0.16);
            color: #0f766e;
            font-weight: 700;
        }

        .task-origin-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            max-width: 100%;
            color: #1d7f68;
            font-size: 12px;
            font-weight: 600;
        }

        .task-origin-link:hover {
            color: #15624f;
            text-decoration: underline;
        }

        .task-origin-empty {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #9ca3af;
            font-size: 12px;
        }

        .article-row-number {
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .article-view-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .view-toggle {
            display: inline-flex;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
        }

        .view-toggle-btn {
            width: 34px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            border-right: 1px solid #e5e7eb;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .view-toggle-btn:last-child {
            border-right: 0;
        }

        .view-toggle-btn.active {
            background: #1d7f68;
            color: #fff;
        }

        .article-card-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .article-card {
            height: 230px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .article-card:hover {
            border-color: rgba(29, 127, 104, 0.62);
            background: #e7f2eb;
            box-shadow: 0 10px 24px rgba(29, 93, 72, 0.15);
            transform: translateY(-2px);
        }
        .translation-mark{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.02em;line-height:1}.translation-mark b{font:inherit}.translation-mark i{font-style:normal;color:currentColor;opacity:.86;font-size:12px}.article-card.is-translating{pointer-events:none}.article-card.is-translating .article-card-title,.article-card.is-translating .article-card-preview{color:transparent!important;background:linear-gradient(105deg,#89968e 18%,#264d3c 40%,#e5ece7 50%,#264d3c 60%,#89968e 82%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:cardTextShine 1.25s linear infinite}@keyframes cardTextShine{to{background-position:-240% 0}}

        .article-card-title {
            width: 100%;
            min-height: 40px;
            color: #1e293b;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.45;
            text-align: left;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-card-preview {
            flex: 1;
            overflow: hidden;
            color: #475569;
            font-size: 12px;
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .article-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            color: #64748b;
            font-size: 11px;
        }

        .article-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 6px;
            border-top: 1px solid #f1f5f9;
        }
        
        /* 文章内容模态框样式 */
        .article-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .article-modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px 12px;
        }
        
        .article-modal-content {
            background: white;
            border-radius: 8px;
            max-width: 1560px;
            width: 96vw;
            width: 100%;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .article-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .article-modal-close {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 15px;
            line-height: 1;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .article-modal-close:hover {
            background: #f1f5f9;
            color: #1f2937;
        }
        
        .article-modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .article-modal-footer {
            padding: 12px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        
        .article-content-display {
            line-height: 1.6;
            color: #374151;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            flex: 1;
            height: auto;
        }
        /* 文章详情正文 Markdown 排版：覆盖 .article-content-display 的 pre-wrap，恢复正常文档流 */
        #modalContent {
            white-space: normal;
            font-size: 15px;
            line-height: 1.78;
            color: #1f2937;
            word-break: break-word;
        }
        #modalContent > :first-child { margin-top: 0; }
        #modalContent h1, #modalContent h2, #modalContent h3,
        #modalContent h4, #modalContent h5, #modalContent h6 {
            margin: 1.15em 0 0.55em;
            font-weight: 700;
            line-height: 1.35;
            color: #111827;
        }
        #modalContent h1 { font-size: 1.5em; }
        #modalContent h2 { font-size: 1.32em; padding-bottom: .3em; border-bottom: 1px solid #e5e7eb; }
        #modalContent h3 { font-size: 1.18em; }
        #modalContent h4 { font-size: 1.08em; }
        #modalContent h5, #modalContent h6 { font-size: 1em; }
        #modalContent p { margin: 0.8em 0; }
        #modalContent ul, #modalContent ol { margin: 0.8em 0; padding-left: 1.6em; }
        #modalContent ul { list-style: disc; }
        #modalContent ol { list-style: decimal; }
        #modalContent li { margin: 0.3em 0; }
        #modalContent a { color: #1d7f68; text-decoration: none; }
        #modalContent a:hover { text-decoration: underline; }
        #modalContent blockquote {
            margin: 1em 0; padding: 0.55em 1em;
            border-left: 4px solid #1d7f68; background: #f4f9f6; color: #374151;
        }
        #modalContent img {
            max-width: 100%; max-height: min(460px, 62vh);
            width: auto; height: auto; object-fit: contain;
            display: block; margin: 10px auto; border-radius: 8px;
        }
        #modalContent img.image-failed { display: none; }
        #modalContent mark.kw-hl { background: #fde68a; color: #78350f; padding: 0 2px; border-radius: 3px; }
        #modalContent table { border-collapse: collapse; margin: 1em 0; width: 100%; font-size: 0.95em; }
        #modalContent th, #modalContent td { border: 1px solid #e2e8f0; padding: 6px 10px; text-align: left; }
        #modalContent th { background: #f6f8f7; font-weight: 600; }
        #modalContent pre {
            background: #0f172a; color: #e2e8f0;
            padding: 12px 14px; border-radius: 8px;
            overflow-x: auto; font-size: 0.9em; line-height: 1.5;
            white-space: pre; margin: 1em 0;
        }
        #modalContent :not(pre) > code {
            background: #eef2f0; color: #0f2e28;
            padding: 2px 5px; border-radius: 4px; font-size: 0.9em;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        #modalContent hr { border: 0; border-top: 1px solid #e5e7eb; margin: 1.5em 0; }

    <script>
        let currentPage = 1;
        const perPage = 10;
        let selectedKeyword = '';
        let selectedKeywordFilters = [];
        let selectedKeywordCount = 0;
        let keywordMapData = [];
        let keywordDragState = null;
        let keywordContextState = null;
        let keywordSuppressClickUntil = 0;
        let articleViewMode = 'card';
        let lastArticles = [];
        
        // 统一的时间格式化函数 - 将UTC时间转换为中国时间(UTC+8)
        function formatDateTimeLocal(dateStr) {
            if (!dateStr) return '-';
            const str = String(dateStr).replace('T', ' ').substring(0, 19);
            // 服务器存储的是UTC时间，需要加8小时转换为中国时间
            try {
                // 解析时间字符串
                const parts = str.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
                if (!parts) return str;
                
                // 创建UTC时间
                const utcDate = new Date(Date.UTC(
                    parseInt(parts[1]), parseInt(parts[2]) - 1, parseInt(parts[3]),
                    parseInt(parts[4]), parseInt(parts[5]), parseInt(parts[6])
                ));
                
                // 加8小时转换为中国时间
                const chinaDate = new Date(utcDate.getTime() + 8 * 60 * 60 * 1000);
                
                const year = chinaDate.getUTCFullYear();
                const month = String(chinaDate.getUTCMonth() + 1).padStart(2, '0');
                const day = String(chinaDate.getUTCDate()).padStart(2, '0');
                const hours = String(chinaDate.getUTCHours()).padStart(2, '0');
                const minutes = String(chinaDate.getUTCMinutes()).padStart(2, '0');
                const seconds = String(chinaDate.getUTCSeconds()).padStart(2, '0');
                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            } catch (e) {
                return str;
            }
        }

        // 移动端菜单切换
        document.addEventListener('DOMContentLoaded', function() {
            const menuBtn = document.getElementById('menuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            
            if (menuBtn && mobileMenu) {
                menuBtn.addEventListener('click', function() {
                    mobileMenu.classList.toggle('hidden');
                });
            }
        });

        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // 页面加载时初始化
        window.onload = function() {
            console.log('📄 聚合结果页面加载，初始化数据...');
            refreshAllData();
            
            // 绑定搜索事件 - 实时搜索（防抖300ms）
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', debounce(function() {
                    if (selectedKeyword) {
                        console.log('🔍 搜索内容变化，重新加载文章...');
                        loadArticles(1);
                    } else {
                        displayKeywordMap(keywordMapData);
                    }
                }, 300));
                
                // 保留回车键搜索
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        if (selectedKeyword) {
                            loadArticles(1);
                        } else {
                            displayKeywordMap(keywordMapData);
                        }
                    }
                });
            }
            
            // 绑定域名筛选事件
            const domainFilter = document.getElementById('domainFilter');
            if (domainFilter) {
                domainFilter.addEventListener('change', function() {
                    if (selectedKeyword) {
                        console.log('🌐 域名筛选变化，重新加载文章...');
                        loadArticles(1);
                    }
                });
            }
            
            // 绑定分类筛选事件
            const categoryFilter = document.getElementById('categoryFilter');
            if (categoryFilter) {
                categoryFilter.addEventListener('change', function() {
                    if (selectedKeyword) {
                        console.log('📁 分类筛选变化，重新加载文章...');
                        loadArticles(1);
                    }
                });
            }
            
            // 绑定来源URL筛选事件
            const sourceUrlFilter = document.getElementById('sourceUrlFilter');
            if (sourceUrlFilter) {
                sourceUrlFilter.addEventListener('change', function() {
                    if (selectedKeyword) {
                        console.log('📍 来源筛选变化，重新加载文章...');
                        loadArticles(1);
                    }
                });
            }
            
            // 加载分类列表
            loadCategories();
            // 加载来源URL列表
            loadSourceUrls();
            // 支持 ?article_id= 直接打开文章详情弹窗（从资讯流/地图等页面跳转而来）
            const _qp = new URLSearchParams(location.search);
            const _aid = _qp.get('article_id');
            if (_aid && document.getElementById('articleModal')) {
                setTimeout(function () { try { viewArticle(Number(_aid)); } catch (e) { console.error('自动打开文章详情失败:', e); } }, 500);
            }
        };

        // 页面获得焦点时刷新数据
        window.addEventListener('focus', function() {
            console.log('🔄 页面获得焦点，刷新数据...');
            refreshAllData();
        });

        // 页面可见性变化时刷新
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                console.log('🔄 页面变为可见，刷新数据...');
                refreshAllData();
            }
        });

        // 刷新所有数据的统一方法
        function refreshAllData() {
            loadStatistics();
            loadDomains(); 
            loadKeywordMap();  // 图谱已移除：该函数有守卫，容器不存在则直接返回（不渲染气泡）
            // 移除关键词图谱后，不再要求先选关键词节点——默认直接加载全部文章
            loadArticles(1);
        }

        // 加载统计信息
        function loadStatistics() {
            fetch('/article-management/api/statistics')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const stats = data.stats;
                        const _el = id => document.getElementById(id);
                        if (_el('totalArticles')) _el('totalArticles').textContent = stats.total_articles || 0;
                        if (_el('totalDomains')) _el('totalDomains').textContent = stats.domains || 0;
                        if (_el('totalDomains')) _el('totalDomains').title = `已入库域名 ${stats.domains || 0}；已启用信源域名 ${stats.registered_source_domains || 0}`;
                        if (_el('lastCrawl')) _el('lastCrawl').textContent = stats.last_crawl_time ? formatDateTimeLocal(stats.last_crawl_time) : '-';
                        if (_el('todayNew')) _el('todayNew').textContent = stats.today_new_articles || 0;
                    }
                })
                .catch(error => console.error('加载统计信息失败:', error));
        }

        // 加载分类列表
        function loadCategories() {
            fetch('/api/categories?is_active=true')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const select = document.getElementById('categoryFilter');
                        if (!select) return;
                        // 清空除了第一个选项之外的所有选项
                        while (select.options.length > 1) {
                            select.remove(1);
                        }
                        // 添加分类选项
                        data.categories.forEach(cat => {
                            const option = document.createElement('option');
                            option.value = cat.id;
                            option.textContent = cat.name;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(error => console.error('加载分类列表失败:', error));
        }
        
        // 加载来源URL列表（主URL）
        function loadSourceUrls() {
            fetch('/api/url-management/urls?per_page=1000&parent_url_id=0')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const select = document.getElementById('sourceUrlFilter');
                        if (!select) return;
                        // 清空除了第一个选项之外的所有选项
                        while (select.options.length > 1) {
                            select.remove(1);
                        }
                        // 添加来源URL选项
                        data.urls.forEach(url => {
                            const option = document.createElement('option');
                            option.value = url.id;
                            option.textContent = url.name || url.url;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(error => console.error('加载来源URL列表失败:', error));
        }
        
        // 加载域名列表
        function loadDomains() {
            fetch('/article-management/api/domains')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const select = document.getElementById('domainFilter');
                        if (!select) return;
                        // 清空除了第一个"所有域名"选项之外的所有选项
                        while (select.options.length > 1) {
                            select.remove(1);
                        }
                        // 添加新的域名选项

                            const option = document.createElement('option');

                            option.textContent = `${item.domain} (${item.count})`;
                            select.appendChild(option);

                    }
                })
                .catch(error => console.error('加载域名列表失败:', error));
        }

        function loadKeywordMap() {
            const container = document.getElementById('keywordMapContainer');
            if (!container) return;
            container.innerHTML = `<div class="col-span-full p-6 text-center text-gray-500">
                <i class="fa fa-spinner fa-spin text-2xl text-blue-500 mb-2 block"></i>
                <p class="text-xs">正在加载关键词图谱...</p>
            </div>`;

            fetch('/article-management/api/keyword-map?limit=500')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        keywordMapData = data.keywords || [];
                        // 初次进入默认选择第一个有效关键词，并立即展示其文章卡片。
                        // 后续刷新保留用户当前选择，避免抢走正在浏览的关键词。
                        if (!selectedKeyword) {
                            const firstKeyword = keywordMapData.find(item => String(item.keyword || '').trim());
                            if (firstKeyword) {
                                const filters = Array.isArray(firstKeyword.filter_keywords) && firstKeyword.filter_keywords.length
                                    ? firstKeyword.filter_keywords : [firstKeyword.keyword];
                                selectKeyword(firstKeyword.keyword, firstKeyword.article_count || 0, filters);
                                return;
                            }
                        }
                        displayKeywordMap(keywordMapData);
                    } else {
                        throw new Error(data.error || '加载失败');
                    }
                })
                .catch(error => {
                    console.error('加载关键词图谱失败:', error);
                    container.innerHTML = `<div class="col-span-full p-6 text-center text-red-500">
                        <i class="fa fa-exclamation-triangle text-2xl mb-2 block"></i>
                        <p class="text-xs">关键词图谱加载失败：${escapeHtml(error.message)}</p>
                    </div>`;
                });
        }

        function displayKeywordMap(keywords) {
            const container = document.getElementById('keywordMapContainer');
            if (!container) return;
            const searchInput = document.getElementById('searchInput');
            const filterText = (searchInput ? searchInput.value : '').trim().toLowerCase();
            const visibleKeywords = (keywords || []).filter(item => {
                if (!String(item.keyword || '').trim()) return false;
                if (!filterText || selectedKeyword) return true;
                return String(item.keyword || '').toLowerCase().includes(filterText);
            });

            if (visibleKeywords.length === 0) {
                container.innerHTML = `<div class="col-span-full p-6 text-center text-gray-500">
                    <i class="fa fa-project-diagram text-3xl text-gray-300 mb-2 block"></i>
                    <p class="text-xs">暂无关键词数据</p>
                </div>`;
                return;
            }

            const maxCount = Math.max(...visibleKeywords.map(item => item.article_count || 0), 1);
            container.innerHTML = visibleKeywords.map(item => {
                const count = item.article_count || 0;
                const scale = Math.sqrt(Math.max(count, 1) / maxCount);
                const bubbleSize = 84 + Math.round(scale * 72);
                const labelSize = bubbleSize < 108 ? 12 : 15;
                const filters = Array.isArray(item.filter_keywords) && item.filter_keywords.length ? item.filter_keywords : [item.keyword];
                const activeClass = selectedKeyword === item.keyword ? ' active' : '';
                const encodedFilters = escapeHtml(JSON.stringify(filters));
                return `<div class="keyword-node-wrap">
                    <button type="button"
                        class="keyword-node${activeClass}"
                        style="--bubble-size: ${bubbleSize}px; --bubble-label-size: ${labelSize}px"
                        data-keyword="${escapeHtml(item.keyword || '')}"
                        data-count="${count}"
                        data-filters="${encodedFilters}"
                        title="${escapeHtml(item.keyword)}">
                        <span class="keyword-node-name">${escapeHtml(item.keyword)}</span>
                        <span class="keyword-node-float" aria-hidden="true">
                            <strong>${count} 篇文章</strong>
                            ${item.task_count || 0} 个任务${item.merged_keyword_count > 1 ? `<br>${item.merged_keyword_count} 个来源关键词` : ''}
                        </span>
                    </button>
                </div>`;
            }).join('');
            bindKeywordNodeInteractions();
        }

        function selectKeyword(keyword, count, filterKeywords = []) {
            selectedKeyword = keyword || '';
            selectedKeywordFilters = Array.isArray(filterKeywords) && filterKeywords.length ? filterKeywords : (selectedKeyword ? [selectedKeyword] : []);
            selectedKeywordCount = count || 0;
            currentPage = 1;
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            displayKeywordMap(keywordMapData);
            updateKeywordSelection();
            loadArticles(1);
        }

        function clearKeywordSelection() {
            selectedKeyword = '';
            selectedKeywordFilters = [];
            selectedKeywordCount = 0;
            currentPage = 1;
            displayKeywordMap(keywordMapData);
            updateKeywordSelection();
            showKeywordPrompt();
        }

        async function postKeywordGovernance(url, payload) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload || {})
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.success === false) {
                throw new Error(data.error || data.message || '操作失败');
            }
            return data;
        }

        function parseKeywordNode(node) {
            if (!node) return null;
            let filters = [];
            try {
                filters = JSON.parse(node.dataset.filters || '[]');
            } catch (e) {
                filters = [];
            }
            const keyword = node.dataset.keyword || '';
            return {
                node,
                keyword,
                count: Number(node.dataset.count || 0),
                filters: Array.isArray(filters) && filters.length ? filters : (keyword ? [keyword] : [])
            };
        }

        function bindKeywordNodeInteractions() {
            document.querySelectorAll('#keywordMapContainer .keyword-node').forEach(node => {
                node.addEventListener('pointerdown', onKeywordPointerDown);
                node.addEventListener('click', onKeywordClick);
                node.addEventListener('contextmenu', onKeywordContextMenu);
            });
        }

        function onKeywordClick(event) {
            if (Date.now() < keywordSuppressClickUntil) {
                event.preventDefault();
                event.stopPropagation();
                return;
            }
            const item = parseKeywordNode(event.currentTarget);
            if (!item) return;
            selectKeyword(item.keyword, item.count, item.filters);
        }

        function onKeywordPointerDown(event) {
            if (event.button !== 0) return;
            const item = parseKeywordNode(event.currentTarget);
            if (!item || !item.keyword) return;
            closeKeywordContextMenu();
            keywordDragState = {
                ...item,
                pointerId: event.pointerId,
                startX: event.clientX,
                startY: event.clientY,
                dragging: false,
                target: null,
                suppressClick: false
            };
            item.node.setPointerCapture(event.pointerId);
            item.node.addEventListener('pointermove', onKeywordPointerMove);
            item.node.addEventListener('pointerup', onKeywordPointerUp);
            item.node.addEventListener('pointercancel', onKeywordPointerCancel);
        }

        function onKeywordPointerMove(event) {
            if (!keywordDragState || keywordDragState.pointerId !== event.pointerId) return;
            const dx = event.clientX - keywordDragState.startX;
            const dy = event.clientY - keywordDragState.startY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (!keywordDragState.dragging && distance < 8) return;
            event.preventDefault();
            if (!keywordDragState.dragging) {
                keywordDragState.dragging = true;
                keywordDragState.suppressClick = true;
                keywordDragState.node.classList.add('dragging', 'merge-source');
            }
            keywordDragState.node.style.transform = `translate(${dx}px, ${dy}px) scale(1.04)`;

            const target = getKeywordDropTarget(event.clientX, event.clientY, keywordDragState.node);
            if (keywordDragState.target && keywordDragState.target !== target) {
                keywordDragState.target.classList.remove('merge-target');
            }
            keywordDragState.target = target;
            if (target) target.classList.add('merge-target');
        }

        function onKeywordPointerUp(event) {
            if (!keywordDragState || keywordDragState.pointerId !== event.pointerId) return;
            const state = keywordDragState;
            if (state.dragging) keywordSuppressClickUntil = Date.now() + 350;
            cleanupKeywordDrag();
            if (state.dragging && state.target) {
                const targetItem = parseKeywordNode(state.target);
                if (targetItem && targetItem.keyword && targetItem.keyword !== state.keyword) {
                    executeKeywordMerge(state, targetItem);
                }
            }
        }

        function onKeywordPointerCancel() {
            cleanupKeywordDrag();
        }

        function cleanupKeywordDrag() {
            if (!keywordDragState) return;
            const node = keywordDragState.node;
            if (keywordDragState.target) keywordDragState.target.classList.remove('merge-target');
            node.classList.remove('dragging', 'merge-source');
            node.style.transform = '';
            node.removeEventListener('pointermove', onKeywordPointerMove);
            node.removeEventListener('pointerup', onKeywordPointerUp);
            node.removeEventListener('pointercancel', onKeywordPointerCancel);
            keywordDragState = null;
        }

        async function executeKeywordMerge(sourceItem, targetItem) {

        // 加载文章列表

        function loadArticles(page = 1) {

            let url = `/article-management/api/articles?page=${page}&per_page=${perPage}`;

        async function loadThemeArticles(page = 1) {

                }
            } catch (e) { console.error('加载主题文章失败:', e); }
        }

        // OpenCC转换器（简繁互转）
        let converterS2T = null;
        let converterT2S = null;
        try {
            converterS2T = OpenCC.Converter({ from: 'cn', to: 'tw' });
            converterT2S = OpenCC.Converter({ from: 'tw', to: 'cn' });
        } catch (e) {
            console.warn('OpenCC加载失败，简繁转换不可用');
        }
        
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function splitKeywordValue(value) {
            return String(value || '')
                .split(/[,，;；、\s]+/)
                .map(k => k.trim())
                .filter(Boolean);
        }

        function addParsedKeyword(map, keyword, location) {
            const clean = String(keyword || '').trim();
            if (!clean) return;
            const existing = map.get(clean) || { keyword: clean, locations: new Set() };
            existing.locations.add(location || 'unknown');
            map.set(clean, existing);
        }

        function parseMatchedKeywords(keywords) {
            const parsed = new Map();
            if (!keywords) return [];

            if (Array.isArray(keywords)) {
                keywords.forEach(item => addParsedKeyword(parsed, item, 'unknown'));
                return Array.from(parsed.values());
            }

            if (typeof keywords === 'object') {
                (keywords.title_keywords || []).forEach(item => addParsedKeyword(parsed, item, 'title'));
                (keywords.content_keywords || []).forEach(item => addParsedKeyword(parsed, item, 'content'));
                (keywords.all_keywords || []).forEach(item => addParsedKeyword(parsed, item, 'unknown'));
                return Array.from(parsed.values());
            }

            const raw = String(keywords).trim();
            if (!raw) return [];

            if (raw.startsWith('{') || raw.startsWith('[')) {
                try {
                    return parseMatchedKeywords(JSON.parse(raw));
                } catch (e) { }
            }

            const locationPattern = /(标题|標題|title|内容|內容|正文|content)\s*[\(:：]\s*([^）)]+)/ig;
            let structuredMatch;
            while ((structuredMatch = locationPattern.exec(raw)) !== null) {
                const label = structuredMatch[1].toLowerCase();
                const location = /title|标题|標題/.test(label) ? 'title' : 'content';
                splitKeywordValue(structuredMatch[2]).forEach(item => addParsedKeyword(parsed, item, location));
            }

            raw.split(/[,，;；]+/).map(k => k.trim()).filter(Boolean).forEach(token => {
                if (token.startsWith('[标]') || token.startsWith('[標]')) {
                    addParsedKeyword(parsed, token.substring(3), 'title');
                } else if (token.startsWith('[文]')) {
                    addParsedKeyword(parsed, token.substring(3), 'content');
                } else if (parsed.size === 0) {
                    addParsedKeyword(parsed, token, 'unknown');
                }
            });

            return Array.from(parsed.values());
        }

        function getMatchedKeywordTexts(keywords) {
            return [...new Set(parseMatchedKeywords(keywords).map(item => item.keyword).filter(Boolean))]
                .sort((a, b) => b.length - a.length);
        }

        // 高亮关键词函数 - 使用OpenCC支持简繁体匹配
        function highlightKeywords(text, keywords) {
            if (!keywords || !text) return text;
            
            const keywordList = getMatchedKeywordTexts(keywords);
            if (keywordList.length === 0) return text;
            
            let result = text;
            keywordList.forEach(keyword => {
                // 生成简体和繁体版本
                const patterns = [keyword];
                if (converterS2T) {
                    const traditional = converterS2T(keyword);
                    if (traditional !== keyword) patterns.push(traditional);
                }
                if (converterT2S) {
                    const simplified = converterT2S(keyword);
                    if (simplified !== keyword && !patterns.includes(simplified)) patterns.push(simplified);
                }
                
                // 匹配所有版本
                patterns.forEach(pattern => {
                    try {
                        const regex = new RegExp('(' + pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                        result = result.replace(regex, '<mark class="bg-yellow-300 text-yellow-900 px-0.5 rounded">$1</mark>');
                    } catch (e) { }
                });
            });

            // 搜索词临时高亮：颜色与匹配关键词（黄色）区分开，用蓝色便于一眼分辨。
            // 必须按标签切分后再替换，否则会在上一步生成的 <mark ...> 标签属性里误替换、破坏 HTML。
            try {
                let query = '';
                const searchBox = document.getElementById('searchInput') || document.getElementById('articleSearchInput');
                if (searchBox && searchBox.value) query = String(searchBox.value).trim();
                if (!query) {
                    // 详情若是新页面打开、或搜索框被清空，从会话记忆里取（下面会持续记录）
                    try { query = String(sessionStorage.getItem('dsh_last_search') || '').trim(); } catch (e) { }
                }
                if (!query) {
                    const fromUrl = new URLSearchParams(location.search).get('q');
                    if (fromUrl) query = String(fromUrl).trim();
                }
                // 记住当前搜索词，供"详情新页面打开/搜索框被清空"时继续高亮
                if (searchBox && searchBox.value && searchBox.value.trim().length >= 2) {
                    try { sessionStorage.setItem('dsh_last_search', searchBox.value.trim()); } catch (e) { }
                }
                if (query.length >= 2) {
                    const queryRegex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                    result = result.split(/(<[^>]+>)/).map(function (segment, index) {
                        if (index % 2) return segment;
                        return segment.replace(queryRegex, '<mark style="background:#38bdf8;color:#06121f;border-radius:3px;padding:0 2px">$1</mark>');
                    }).join('');
                }
            } catch (e) { }

            return result;
        }
        
        // 渲染关键词标签 - 区分标题[标]和内容[文]匹配
        function renderKeywordTags(keywords, options = {}) {
            const parsed = parseMatchedKeywords(keywords);
            if (parsed.length === 0) return '';

            const badges = [];
            const titleKeywords = [];
            const contentKeywords = [];
            const unknownKeywords = [];

            parsed.forEach(item => {
                const locations = item.locations || new Set(['unknown']);
                if (locations.has('title')) {
                    titleKeywords.push(item.keyword);
                }
                if (locations.has('content')) {
                    contentKeywords.push(item.keyword);
                }
                if (!locations.has('title') && !locations.has('content')) {
                    unknownKeywords.push(item.keyword);
                }
            });

            if (titleKeywords.length) {
                badges.push(`<span class="keyword-badge keyword-badge-title" title="文章标题匹配">
                    <i class="fa fa-heading"></i><span>标题：${titleKeywords.map(escapeHtml).join('、')}</span>
                </span>`);
            }
            if (contentKeywords.length) {
                const contentLabel = options.hideContentLabel ? '' : 'Content: ';
                badges.push(`<span class="keyword-badge keyword-badge-content" title="文章正文匹配">
                    <i class="fa fa-file-text"></i><span>${contentLabel}${contentKeywords.map(escapeHtml).join('、')}</span>
                </span>`);
            }
            if (unknownKeywords.length) {
                badges.push(`<span class="keyword-badge keyword-badge-unknown" title="历史数据未记录匹配位置">
                    <i class="fa fa-tag"></i><span>${unknownKeywords.map(escapeHtml).join('、')}</span>
                </span>`);
            }

            return `<span class="keyword-badges">${badges.join('')}</span>`;
        }

        function getScheduleIdFromTaskId(taskId) {
            const match = String(taskId || '').match(/^schedule_(\d+)_/);
            return match ? match[1] : '';
        }

        function taskDetailUrl(article) {
            const taskId = article.latest_task_id || '';
            if (!taskId) return '';
            const scheduleId = article.latest_schedule_id || getScheduleIdFromTaskId(taskId);
            if (scheduleId) {
                return `/schedule-management?edit_schedule_id=${encodeURIComponent(scheduleId)}`;
            }
            return `/api/app/task/${encodeURIComponent(taskId)}`;
        }

        function isPlaceholderTaskLabel(value) {
            const normalized = String(value || '').trim().toLowerCase();
            const compact = normalized.replace(/\s+/g, '');
            return normalized === 'source task' || compact === 'sourcetask' || normalized === '来源任务';
        }

        function renderTaskOrigin(article) {
            const taskId = article.latest_task_id || '';
            const siteName = article.source_url_name || '';
            if (!taskId) {
                if (siteName) {
                    return `<span class="task-origin-empty" title="${escapeHtml(siteName)}">
                        <i class="fa fa-globe text-gray-400 text-xs"></i><span>${escapeHtml(siteName)}</span>
                    </span>`;
                }
                return `<span class="task-origin-empty" title="无任务关联">
                    <i class="fa fa-tasks text-gray-300 text-xs"></i><span>无任务</span>
                </span>`;
            }
            const candidates = [
                article.latest_task_display_name,
                article.source_task_name,
                article.latest_task_name,
                taskId
            ].filter(value => value && !isPlaceholderTaskLabel(value));
            const label = candidates[0] || taskId;
            // 若有中文站点名，显示"站点名 · 任务名"，tooltip 保留原始 taskId
            const displayLabel = siteName ? `${siteName} · ${label}` : label;
            const titleLabel = siteName ? `${siteName} · ${label} · ${taskId}` : `${label} · ${taskId}`;
            const url = taskDetailUrl(article);
            return `<a href="${url}" class="task-origin-link" title="${escapeHtml(titleLabel)}">
                <i class="fa fa-tasks text-xs"></i><span class="truncate">${escapeHtml(displayLabel)}</span>
            </a>`;
        }

        // 卡片高亮词：优先当前搜索词，其次选中的关键词，否则用文章匹配关键词。
        function currentHighlightKeywords(article) {
            if (window.__activeSearchQuery) return [window.__activeSearchQuery];
            const kwFilters = (selectedKeywordFilters && selectedKeywordFilters.length)
                ? selectedKeywordFilters
                : (selectedKeyword ? [selectedKeyword] : []);
            if (kwFilters.length) return kwFilters.slice();
            // 主题聚合页（如【竞争情报】）用该主题配置的关键词一并高亮，
            // 保证竞品名（威努特/六方云/奇安信…）在标题与摘要里被标出来。
            if (themeHighlightKeywords.length) {
                return themeHighlightKeywords.concat(getMatchedKeywordTexts(article.matched_keywords));
            }
            return getMatchedKeywordTexts(article.matched_keywords);
        }

        // 主题页配置的关键词（来自行业包 fixed_topics，如【竞争情报】的竞品名单）
        let themeHighlightKeywords = [];
        function buildThemeKeywordChips(article) {
            if (!themeHighlightKeywords.length) return [];
            const haystack = String(article.title || '') + ' ' + String(article.content || article.summary || '');
            return themeHighlightKeywords.map(kw => ({ kw: kw, hit: Boolean(kw) && haystack.indexOf(kw) >= 0 }));
        }

        function buildArticleViewModel(article) {
            const fullTime = formatDateTimeLocal(article.last_crawled);
            const lastCrawled = fullTime !== '-' ? fullTime.substring(5, 16).replace(' ', ' ') : '-';
            const shortDomain = article.domain ? article.domain.replace(/^https?:\/\/(www\.)?/, '').split('/')[0] : '-';
            const rawTitle = article.title || '无标题';
            const hlKeywords = currentHighlightKeywords(article);
            const highlightedTitle = highlightKeywords(escapeHtml(rawTitle), hlKeywords);
            const rawContent = String(article.content || article.summary || '').replace(/\s+/g, ' ').trim();
            const preview = rawContent || '暂无内容预览';
            const highlightedPreview = highlightKeywords(escapeHtml(preview), hlKeywords);
            return {
                id: article.id,
                rawTitle,
                highlightedTitle,
                highlightedPreview,
                shortDomain,
                lastCrawled,
                keywordTags: renderKeywordTags(article.matched_keywords, articleViewMode === 'card' ? { hideContentLabel: true } : {}),
                themeChips: buildThemeKeywordChips(article),
                publishDate: article.publish_date || '未知',
                contentLength: article.content_length || 0,
                taskOrigin: renderTaskOrigin(article)
            };
        }

        function setArticleViewMode(mode) {

        function handleArticleCardClick(event, articleId) {

        async function prewarmArticleSpeech(side){

        // 删除文章
        async function deleteArticle(id) {
            if (!await showConfirmDialog('确定要删除这篇文章吗？',{title:'删除文章',confirmText:'确认删除'})) return;
            
            fetch(`/article-management/api/article/${id}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('删除成功');
                        loadArticles(currentPage);
                        loadStatistics();
                    } else {
                        alert('删除失败: ' + data.error);
                    }
                })
                .catch(error => console.error('删除失败:', error));
        }

        // 清空本地文章（仅清空本地 articles / article_tasks，不影响URL、定时任务和RAGFlow）
        function clearLocalArticles() {
            if (!confirm('确定要清空本地文章吗？这会删除本地已保存的所有文章，方便重新测试聚合。')) return;
            const confirmText = prompt('请输入 DELETE 确认清空本地文章：');
            if (confirmText !== 'DELETE') {
                alert('已取消清空。');
                return;
            }

            fetch('/article-management/api/articles/clear-local', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ confirm: 'DELETE_LOCAL_ARTICLES' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const result = data.result || {};
                    alert(`清空完成：删除本地文章 ${result.deleted_articles || 0} 篇，关联记录 ${result.deleted_article_tasks || 0} 条。`);
                    currentPage = 1;
                    refreshAllData();
                    loadCategories();
                    loadSourceUrls();
                } else {
                    alert('清空失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(error => {
                console.error('清空本地文章失败:', error);
                alert('清空失败，请查看控制台或后端日志。');
            });
        }

            let url = `/article-management/api/export?format=zip`;
            if (selectedKeyword) url += `&keyword=${encodeURIComponent(selectedKeyword)}`;

            window.location.href = url;

        // 诊断文章质量
        function diagnoseArticles() {
            if (!confirm('确定要诊断所有文章的内容质量吗？这可能需要几分钟时间。')) return;
            
            const loadingMsg = '正在诊断文章质量，请稍候...';
            alert(loadingMsg);
            
            fetch('/article-management/api/diagnose', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ limit: 1000 })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const result = data.result;
                    let message = `📊 诊断完成！\n\n`;
                    message += `总文章数: ${result.total}\n`;
                    message += `✅ 良好: ${result.good} (${(result.good/result.total*100).toFixed(1)}%)\n`;
                    message += `❌ 有问题: ${result.bad} (${(result.bad/result.total*100).toFixed(1)}%)\n\n`;
                    
                    if (result.issues_summary && Object.keys(result.issues_summary).length > 0) {
                        message += `🐛 主要问题:\n`;
                        Object.entries(result.issues_summary).slice(0, 5).forEach(([issue, count]) => {
                            message += `  • ${issue}: ${count}篇\n`;
                        });
                    }
                    
                    if (result.bad > 0) {
                        message += `\n💡 发现 ${result.bad} 篇文章需要修复。\n建议点击"批量修复"按钮进行修复。`;
                    }
                    
                    alert(message);
                } else {
                    alert('诊断失败: ' + data.error);
                }
            })
            .catch(error => {
                console.error('诊断失败:', error);
                alert('诊断失败: ' + error.message);
            });
        }
        
        // 修复单篇文章
        function fixSingleArticle(articleId) {
            if (!confirm('确定要重新提取这篇文章的内容吗？')) return;
            
            const btn = event.target.closest('button');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
            btn.disabled = true;
            
            fetch('/article-management/api/fix-article', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ article_id: articleId })
            })
            .then(response => response.json())
            .then(data => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                
                if (data.success) {
                    let message = '✅ 修复成功！\n\n';
                    message += `质量分数提升: ${data.old_quality} → ${data.new_quality}\n`;
                    message += `问题数量: ${data.old_issues} → ${data.new_issues}`;
                    alert(message);
                    loadArticles(currentPage);
                } else {
                    alert('修复失败: ' + data.error);
                }
            })
            .catch(error => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                console.error('修复失败:', error);
                alert('修复失败: ' + error.message);
            });
        }
        
        // 批量修复文章
        function batchFixArticles() {
            const message = '确定要批量修复所有有问题的文章吗？\n\n这将重新提取内容质量低的文章。\n这可能需要较长时间，请耐心等待。';
            if (!confirm(message)) return;
            
            alert('🔧 开始批量修复，请稍候...\n此过程可能需要几分钟时间，请勿关闭页面。');
            
            fetch('/article-management/api/batch-fix', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ quality_threshold: 60 })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const result = data.result;
                    let message = `📊 批量修复完成！\n\n`;
                    message += `总计: ${result.total}篇\n`;

                    message += `⚠️ 无改进: ${result.no_improvement}篇\n`;

                } else {
                    alert('批量修复失败: ' + data.error);
                }
            })
            .catch(error => {
                console.error('批量修复失败:', error);
                alert('批量修复失败: ' + error.message);
