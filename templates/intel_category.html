<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ category_name }}｜资讯分类浏览</title>
    <link rel="stylesheet" href="/static/css/fontawesome.css">
    <link rel="stylesheet" href="/static/css/dashboard-theme.css">
    <style>
        :root { --accent:#1d7f68; --ink:#17201d; --muted:#64748b; }
        * { box-sizing:border-box; }
        body { margin:0; background:#eef2ef; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
        .wrap { max-width:1440px; margin:0 auto; padding:94px 22px 36px; }
        .head { display:flex; align-items:end; justify-content:space-between; gap:18px; margin-bottom:20px; }
        .head h1 { margin:0; font-size:25px; }
        .head p { margin:7px 0 0; color:var(--muted); font-size:14px; }
        .search { display:flex; gap:8px; align-items:center; }
        .search input { width:280px; border:1px solid #cbd5d1; border-radius:8px; padding:10px 12px; background:#fff; font:inherit; }
        .toolbar-button,.pager button { border:0; border-radius:7px; padding:10px 14px; background:#365b47; color:#fff; cursor:pointer; font:inherit; }
        .toolbar-button.secondary { background:#fff; color:#365b47; border:1px solid #a8bbae; }
        .toolbar-button:hover,.pager button:hover { filter:brightness(.94); }
        .grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; }
        .empty { grid-column:1 / -1; padding:50px; color:var(--muted); text-align:center; }
        .pager { display:flex; align-items:center; justify-content:center; gap:9px; margin:24px; }
        .pager button:disabled { cursor:not-allowed; opacity:.45; }
        .article-card { height:230px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; padding:10px; display:flex; flex-direction:column; gap:8px; cursor:pointer; transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
        .article-card:hover { border-color:rgba(29,127,104,.62); background:#e7f2eb; box-shadow:0 10px 24px rgba(29,93,72,.15); transform:translateY(-2px); }
        .article-card-title { width:100%; min-height:40px; border:0; padding:0; background:transparent; color:#1e293b; font-size:13px; font-weight:700; line-height:1.45; text-align:left; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .article-card-title:hover,.article-card-title:focus { background:transparent; color:#1e293b; outline:0; }
        .article-card-meta { display:flex; flex-wrap:wrap; gap:6px; color:#64748b; font-size:11px; }.article-card-meta span,.task-origin-empty { display:flex; align-items:center; gap:4px; min-width:0; }
        .article-card-preview { flex:1; overflow:hidden; color:#475569; font-size:12px; line-height:1.55; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; }
        .article-card-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:6px; border-top:1px solid #f1f5f9; }.task-origin-empty { max-width:100%; color:#9ca3af; font-size:12px; overflow:hidden; }.task-origin-empty span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .article-card-actions { display:flex; flex-shrink:0; gap:3px; }.article-card-action { display:inline-flex; width:23px; height:22px; align-items:center; justify-content:center; border:0; border-radius:4px; color:#fff; font-size:10px; cursor:pointer; transition:filter .15s ease,transform .15s ease; }.article-card-action:hover { filter:brightness(.88); transform:translateY(-1px); }.article-card-action.view { background:#1d7f68; }.article-card-action.translate { width:auto; padding:0 5px; background:#365b47; font-size:9px; font-weight:800; }.article-card-action.delete { background:#ef4444; }.article-card-action.follow { color:#854d0e; background:#fef3c7; border:1px solid #d97706; }.article-card-action.follow.is-following { color:#fff; background:#7c3f00; border-color:#5f3000; }.translation-mark { display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:800; }.translation-mark i { font-style:normal; font-size:12px; }.article-card.is-translating { pointer-events:none; }
        mark.search-hit { background:#fde047; color:#713f12; padding:0 2px; border-radius:3px; }
        .article-modal { display:none; position:fixed; inset:0; z-index:1000; overflow-y:auto; background:rgba(0,0,0,.5); }.article-modal.active { display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; }.article-modal-content { width:min(1560px,96vw); max-height:92vh; display:flex; flex-direction:column; position:relative; border-radius:8px; background:#fff; box-shadow:0 20px 60px rgba(0,0,0,.3); }.article-modal-header,.article-modal-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; border-bottom:1px solid #e5e7eb; }.article-modal-header h3 { margin:0; font-size:18px; }.article-modal-close { width:32px; height:32px; border:0; border-radius:6px; background:transparent; color:#64748b; cursor:pointer; }.article-modal-body { flex:1; overflow-y:auto; padding:12px 16px; }.article-modal-footer { justify-content:flex-end; border-top:1px solid #e5e7eb; border-bottom:0; }.article-modal-footer button { border:0; border-radius:6px; padding:7px 14px; background:#4b5563; color:#fff; cursor:pointer; font-size:13px; font-weight:600; }.article-modal-footer .modal-translate-action { background:#365b47; }.article-meta { display:flex; flex-wrap:wrap; gap:3px 14px; margin-bottom:10px; border-radius:0; background:transparent; padding:0; font-size:12px; }.article-meta-item { display:inline-flex; align-items:baseline; gap:4px; border:0; border-radius:0; background:transparent; padding:0; }.article-meta-item.full { display:block; width:100%; margin:0 0 2px; }.article-meta-label { width:auto; flex-shrink:0; color:#9ca3af; font-size:11px; font-weight:600; white-space:nowrap; }.article-meta-value { flex:1; min-width:0; font-size:12px; color:#374151; word-break:break-all; }.article-meta-title .article-meta-value { font-weight:700; font-size:14px; color:#111827; }.article-section-title { display:flex; align-items:center; justify-content:space-between; margin:8px 0; color:#374151; font-size:15px; }.article-content-display { min-height:300px; border:1px solid #e5e7eb; border-radius:8px; padding:14px; color:#374151; line-height:1.8; white-space:pre-wrap; word-wrap:break-word; }.article-reading-columns.is-translating { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; }.translation-reading-panel { display:none; }.article-reading-columns.is-translating .translation-reading-panel { display:block; }.translation-reading-panel h4 { margin:8px 0; color:#374151; }.article-card.is-translating [data-card-title],.article-card.is-translating [data-card-preview] { opacity:.45; }
        .article-reading-columns{display:block}.article-reading-columns.is-translating{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.article-reading-columns.is-original{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.article-reading-columns.is-original .article-content-display{min-height:480px}.article-modal-action.is-active{background:#1d7f68!important}.article-reading-panel{min-width:0}.translation-reading-panel{display:none}.article-reading-columns.is-translating .translation-reading-panel{display:block}.article-reading-panel-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;color:#374151;font-size:14px;font-weight:700}.translation-segment{display:block;min-height:2.2em;padding:2px 0}.translation-segment + .translation-segment{margin-top:14px;padding-top:14px;border-top:1px dashed #d8e4dc}.translation-segment.is-pending{color:#738076}.translation-segment.is-failed{color:#9b3030;background:#fff5f5;border-radius:6px;padding:8px}.translation-segment .retry-translation{margin-left:8px;color:#365b47;font-weight:700;text-decoration:underline}.article-speech-action{margin-right:8px;border:0;border-radius:5px;padding:3px 7px;background:#edf5ef;color:#365b47;font-size:11px;font-weight:700;cursor:pointer}.article-speech-action:hover{background:#dbece0}.article-speech-action[disabled]{opacity:.5;cursor:not-allowed;background:#eef1ef;color:#9aa8a0}.article-speech-action.is-loading{background:#eef1ef;color:#9aa8a0;opacity:.85}.article-speech-action.is-ready{background:#1d7f68;color:#fff}.article-speech-action.is-ready:hover{background:#166a55}.article-speech-action.is-ready[disabled]{opacity:1;cursor:pointer}.translation-segment.is-speaking{background:#eef6f0;border-radius:6px;padding:7px;box-shadow:inset 3px 0 #365b47}.article-reading-columns.is-translating .translation-segment.translate-flow{color:transparent;background:linear-gradient(105deg,#89968e 18%,#264d3c 40%,#eef3ef 50%,#264d3c 60%,#89968e 82%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flowShine 1.15s linear infinite}.article-reading-columns.is-translating .article-content-display{min-height:480px}.article-modal-action{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:6px;padding:7px 14px;background:#4b5563;color:#fff;cursor:pointer;font-size:13px;font-weight:600}.article-modal-action.is-translate{background:#365b47}.article-modal-action.is-secondary{background:#6b7280}.speech-buffer-wave{--speech-buffer-progress:0%;display:inline-flex;align-items:center;gap:6px;margin-right:8px;color:#526259;font-size:11px;font-weight:700;position:relative;padding-left:44px;min-height:16px}.speech-buffer-wave[hidden]{display:none}.article-content-display.is-translating{pointer-events:none}.article-content-display.is-translating .translate-flow{color:transparent;background:linear-gradient(105deg,#89968e 18%,#264d3c 40%,#eef3ef 50%,#264d3c 60%,#89968e 82%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flowShine 1.15s linear infinite}
        @media(max-width:1100px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } } @media(max-width:700px) { .wrap { padding:82px 14px 24px; }.head { align-items:stretch; flex-direction:column; }.search input { width:100%; }.grid { grid-template-columns:1fr; }.article-meta,.article-reading-columns.is-translating { grid-template-columns:1fr; }.article-meta-item.full { grid-column:auto; } }
    mark.kw-hl { background:#fde047; color:#713f12; padding:0 2px; border-radius:3px; }
    .article-content-display h1,.article-content-display h2,.article-content-display h3,.article-content-display h4 { color:#111827; line-height:1.4; margin:18px 0 10px; }
    .article-content-display h1 { font-size:22px; } .article-content-display h2 { font-size:19px; } .article-content-display h3 { font-size:16px; } .article-content-display h4 { font-size:14px; }
    .article-content-display p { margin:0 0 12px; }
    .article-content-display ul,.article-content-display ol { padding-left:22px; margin:0 0 12px; }
    .article-content-display li { margin:4px 0; }
    .article-content-display blockquote { margin:10px 0; padding:6px 12px; border-left:3px solid #cbd5d1; background:#f6faf8; color:#475569; }
    .article-content-display pre { background:#f1f5f9; border:1px solid #e2e8f0; border-radius:6px; padding:10px; overflow:auto; }
    .article-content-display code { background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:12px; }
    .article-content-display pre code { background:transparent; padding:0; }
    .article-content-display table { border-collapse:collapse; margin:10px 0; max-width:100%; }
    .article-content-display th,.article-content-display td { border:1px solid #e5e7eb; padding:6px 10px; font-size:12px; text-align:left; }
    .article-content-display th { background:#f1f5f9; }
    .article-content-display img { max-width:100%; height:auto; }
    .article-content-display a { color:#1d7f68; word-break:break-all; }
    </style>
    <script src="/static/js/marked.min.js"></script>
</head>
<body data-industry-pack-id="{{ active_industry_pack.id if active_industry_pack else '' }}" data-industry-name="{{ active_industry_pack.name if active_industry_pack else '' }}">
{% include '_dashboard_nav.html' %}
<main class="wrap">
    <div class="head"><div><h1>{{ category_name }}</h1><p>按首页分类视角浏览全部文章；可搜索标题和摘要，不显示关键词气泡。</p></div><form class="search" id="search"><input id="q" placeholder="搜索标题或摘要" autocomplete="off"><button class="toolbar-button" type="submit"><i class="fa fa-search"></i> 搜索</button><button class="toolbar-button secondary" type="button" onclick="location.href='/?home_view=dashboard'"><i class="fa fa-arrow-left"></i> 返回</button></form></div>
    <div class="grid" id="grid" aria-live="polite"></div>
    <div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div>
</main>
<div id="articleModal" class="article-modal" aria-label="文章详情" role="dialog" aria-modal="true"><div class="article-modal-content"><div class="article-modal-header" style="position:absolute;top:8px;right:10px;background:transparent;border:0;padding:0;z-index:6;justify-content:flex-end"><button onclick="closeArticleModal()" class="article-modal-close" aria-label="关闭"><i class="fa fa-times"></i></button></div><div class="article-modal-body"><div class="article-meta"><div class="article-meta-item full article-meta-title" style="display:block;margin:0 0 8px"><div class="article-meta-value" id="modalTitle" style="font-size:20px;font-weight:800;color:#111827;line-height:1.35">-</div></div><div class="article-meta-item"><div class="article-meta-label"><i class="fa fa-link"></i> URL</div><div class="article-meta-value"><a id="modalUrl" href="#" target="_blank" rel="noopener">-</a></div></div><div class="article-meta-item"><div class="article-meta-label"><i class="fa fa-calendar"></i> 发布日期</div><div class="article-meta-value" id="modalDate">-</div></div><div class="article-meta-item"><div class="article-meta-label"><i class="fa fa-building"></i> 网站名称</div><div class="article-meta-value" id="modalSiteName">-</div></div><div class="article-meta-item"><div class="article-meta-label"><i class="fa fa-globe"></i> 来源</div><div class="article-meta-value" id="modalDomain">-</div></div><div class="article-meta-item"><div class="article-meta-label"><i class="fa fa-clock"></i> 聚合时间</div><div class="article-meta-value" id="modalCrawlTime">-</div></div><div class="article-meta-item"><div class="article-meta-label"><i class="fa fa-tag"></i> 匹配关键词</div><div class="article-meta-value" id="modalKeywords">-</div></div></div><div id="articleReadingColumns" class="article-reading-columns"><section class="article-reading-panel"><h4 class="article-section-title"><span></span><span><button type="button" id="speakSourceBtn" class="article-speech-action" style="display:none" onclick="speakArticle('source')"><i class="fa fa-volume-up"></i> 朗读原文</button><span id="speechBufferWave" class="speech-buffer-wave" hidden aria-live="polite"><span>预缓存 0/3</span></span><span id="modalContentLength">0 字符</span></span></h4><div id="modalContent" class="article-content-display">正在加载...</div></section><section id="translationReadingPanel" class="article-reading-panel translation-reading-panel"><h4 class="article-reading-panel-heading"><span><i class="fa fa-language"></i> 译文</span><span><button type="button" id="speakTranslationBtn" class="article-speech-action" style="display:none" onclick="speakArticle('translation')"><i class="fa fa-volume-up"></i> 朗读译文</button><span id="translationProgress">等待翻译</span></span></h4><div id="modalTranslation" class="article-content-display">等待翻译...</div></section></div></div><div class="article-modal-footer"><button id="showRawBtn" type="button" onclick="showOriginalArticle()" class="article-modal-action is-secondary" title="显示聚合原文，与左侧 LLM 精炼文对比"><i class="fa fa-file-text"></i> 对比原文</button><button id="modalTranslateBtn" onclick="translateModalArticle()" style="display:none" class="article-modal-action is-translate modal-translate-action" title="Translate / 翻译" aria-label="Translate / 翻译"><span class="translation-mark" aria-hidden="true"><b>EN</b><i>⇄</i><b>中</b></span></button><button type="button" onclick="stopArticleSpeech()" style="display:none" class="article-modal-action is-secondary"><i class="fa fa-stop"></i> 停止朗读</button><button type="button" onclick="quoteSelectionToMiniChat(event)" class="article-modal-action is-secondary" title="将选中的文章内容引用到AI助手"><i class="fa fa-quote-left"></i> 引用到AI助手</button><button type="button" onclick="shareCurrentArticle(this)" class="article-modal-action is-secondary" title="分享文章给微信好友"><i class="fa fa-share-alt"></i> 分享</button><button onclick="closeArticleModal()" class="article-modal-action is-secondary"><i class="fa fa-times"></i> 关闭</button></div></div></div>
<script>
const category={{ category|tojson }}, pageSize=20; let page=1,totalPages=1,currentQuery='',currentArticle=null;
const escapeHtml=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const translationMark=()=>'<span class="translation-mark" aria-hidden="true"><b>EN</b><i>⇄</i><b>中</b></span>';
function keywordTexts(value) { if (!value) return []; if (Array.isArray(value)) return value.flatMap(keywordTexts); if (typeof value==='object') return Object.values(value).flatMap(keywordTexts); const raw=String(value).trim(); if (!raw) return []; try { if (raw[0]==='['||raw[0]==='{') return keywordTexts(JSON.parse(raw)); } catch (_) {} return raw.split(/[,，;；]+/).map(item=>item.replace(/^\[[^\]]+\]\s*/,'').replace(/^.*?[：:]\s*/, '').trim()).filter(Boolean); }
function highlightText(value, keywords=[]) { const terms=[...new Set([...keywordTexts(keywords),...currentQuery.trim().split(/\s+/).filter(Boolean)])].filter(Boolean).sort((a,b)=>b.length-a.length); const safe=escapeHtml(value); if (!terms.length) return safe; const pattern=terms.map(term=>term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'); return pattern ? safe.replace(new RegExp(`(${pattern})`,'gi'),'<mark class="search-hit">$1</mark>') : safe; }
// —— 阶段1：正文统一 Markdown 渲染（与首页同款：marked 渲染 + 关键词 <mark class="kw-hl"> 高亮，不破坏结构）——
function renderMarkdownContent(content, keywords=[]) { const text=String(content||'').replace(/\r/g,''); const terms=[...new Set(keywordTexts(keywords))].filter(Boolean).sort((a,b)=>b.length-a.length); let html=null; if (typeof marked !== 'undefined') { try { marked.setOptions({breaks:true,gfm:true,sanitize:false}); html=marked.parse(text); } catch(e) { html=null; } } if (!html) return highlightText(text,keywords); html=html.replace(/\shref=["'](?:javascript|vbscript|data):[^"']*["']/gi,' href="#"').replace(/\son\w+\s*=\s*["'][^"']*["']/gi,''); if (!terms.length) return html; const pattern=terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'); return String(html).split(/(<[^>]+>)/).map((seg,i)=>i%2?seg:seg.replace(new RegExp(`(${pattern})`,'gi'),'<mark class="kw-hl">$1</mark>')).join(''); }
// —— 阶段3：无正文条目的「在线转换阅读」（失败静默降级为原文链接）——
function injectCatConvertButton(article,keywords){ const mc=document.getElementById('modalContent');if(!mc||mc.parentNode.querySelector('.dynamic-convert-bar'))return;const bar=document.createElement('div');bar.className='dynamic-convert-bar';bar.innerHTML='<p style="margin:0 0 10px;color:#6b7280;font-size:13px">该动态暂无正文摘要。</p>';const btn=document.createElement('button');btn.type='button';btn.style.cssText='border:0;border-radius:6px;padding:7px 14px;background:#1d7f68;color:#fff;cursor:pointer;font-size:13px;font-weight:600';btn.textContent='在线转换阅读';btn.onclick=()=>convertCatRead(article,keywords,btn);bar.appendChild(btn);const link=document.createElement('a');link.href=article.url||'#';link.target='_blank';link.rel='noopener';link.style.cssText='margin-left:10px;font-size:13px;color:#1d7f68';link.textContent='打开原文链接';bar.appendChild(link);mc.parentNode.insertBefore(bar,mc); }
async function convertCatRead(article,keywords,btn){ if(btn){btn.disabled=true;btn.textContent='转换中…';} try{ const response=await fetch(`/api/intel/articles/${encodeURIComponent(article.id||'')}/convert-read`,{cache:'no-store'}),data=await response.json();if(!response.ok||!data.success)throw Error(data.message||data.error||'转换失败');const mc=document.getElementById('modalContent');if(mc)mc.innerHTML=renderMarkdownContent(data.markdown,keywords);const bar=document.querySelector('.dynamic-convert-bar');if(bar)bar.remove(); }catch(err){ if(btn){btn.disabled=false;btn.textContent='转换失败，点此重试';} } }
// 详情页功能开关（朗读/翻译）——默认关闭。卡片由 JS 动态渲染，这里按开关在渲染后移除
// 卡片上的翻译按钮（关闭时移除而非隐藏），并用定时器兜住"渲染晚于配置返回"的情况。
// 取不到行业包时不显示（= 默认关闭），符合"默认不启用"的要求。
(function(){
  function apply(f){
    window.__intelFeatures = f || {};
    var strip = function(){
      if (f && f.translate) return;
      var nodes = document.querySelectorAll('.article-card-action.translate');
      for (var i=0;i<nodes.length;i+=1) { if (nodes[i].parentNode) nodes[i].parentNode.removeChild(nodes[i]); }
    };
    strip();
    if (!window.__intelFeatTimer) window.__intelFeatTimer = setInterval(strip, 1500);
    // 详情弹窗按钮跟随开关：翻译按钮 + 朗读按钮（朗读原文/朗读译文/停止朗读）
    var tb = document.getElementById('modalTranslateBtn');
    if (tb) tb.style.display = (f.translate) ? '' : 'none';
    if (!f.read_aloud) {
      ['speakSourceBtn','speakTranslationBtn'].forEach(function(id){ var el=document.getElementById(id); if(el && el.parentNode) el.parentNode.removeChild(el); });
      var sb = document.querySelector('#articleModal button[onclick*="stopArticleSpeech"]');
      if (sb && sb.parentNode) sb.parentNode.removeChild(sb);
    } else {
      ['speakSourceBtn','speakTranslationBtn'].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display=''; });
      var sb2 = document.querySelector('#articleModal button[onclick*="stopArticleSpeech"]');
      if (sb2) sb2.style.display='';
    }
  }
  var pid = (document.body && document.body.dataset.industryPackId) || window.__intelIndustryPackId || '';
  if (!pid) { apply({}); return; }
  fetch('/api/intel/industry-packs/'+encodeURIComponent(pid)+'/configuration',{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(d){ apply((d && d.pack && d.pack.features) || {}); })
    .catch(function(){ apply({}); });
})();
function renderIntelCard(article) { const id=Number(article.article_id||0),title=article.title||'无标题',preview=String(article.trend_summary||article.why_important||article.content_preview||article.final_reason||article.rule_reason||'暂无资讯摘要').replace(/\s+/g,' ').trim(),domain=String(article.domain||'-').replace(/^https?:\/\/(www\.)?/,'').split('/')[0]||'-',source=article.source_display_name||article.source_name||article.domain||'无任务'; return `<article class="article-card" data-article-id="${id}" role="button" tabindex="0" title="打开文章详情"><button type="button" class="article-card-title" data-card-title onclick="event.stopPropagation();viewArticle(${id})" title="${escapeHtml(title)}">${highlightText(title,article.matched_keywords||article.classification_keywords)}</button><div class="article-card-meta"><span title="${escapeHtml(article.domain||'-')}"><i class="fa fa-link"></i> ${escapeHtml(domain)}</span><span><i class="fa fa-calendar"></i> ${escapeHtml(article.publish_date||article.effective_time||'未知')}</span><span><i class="fa fa-font"></i> ${Number(article.content_length||0)}字</span></div><div class="article-card-preview" data-card-preview>${highlightText(preview,article.matched_keywords||article.classification_keywords)}</div><div class="article-card-footer"><div class="task-origin-empty" title="${escapeHtml(source)}"><i class="fa fa-globe"></i><span>${escapeHtml(source)}</span></div><div class="article-card-actions"><button type="button" class="article-card-action view" onclick="event.stopPropagation();viewArticle(${id})" title="查看文章"><i class="fa fa-eye"></i></button><button type="button" class="article-card-action translate" onclick="translateIntelCard(${id},event)" title="Translate / 翻译">${translationMark()}</button>${(window.__canDeleteArticles===false)?'':'<button type="button" class="article-card-action delete" data-del-perm="1" onclick="deleteIntelArticle('+id+',event)" title="删除文章"><i class="fa fa-trash"></i></button>'}<button type="button" class="article-card-action follow" onclick="followIntelArticle(${id},event)" title="加入当前关注"><i class="fa fa-star"></i></button></div></div></article>`; }
function bindCards() { document.querySelectorAll('#grid [data-article-id]').forEach(card=>{const open=e=>{if(e.target.closest('button,a'))return;viewArticle(Number(card.dataset.articleId));};card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(e);}};}); }
async function load() { const params=new URLSearchParams({category,page:String(page),per_page:String(pageSize),time_range:'730d',q:currentQuery}); if(category==='policy'){params.delete('category');params.set('policy_only','true');} const response=await fetch('/api/intel/articles?'+params); const data=await response.json(); if(!response.ok||!data.success)throw Error(data.error||'加载失败'); totalPages=Math.max(1,Number(data.total_pages)||1); document.getElementById('grid').innerHTML=(data.articles||[]).map(renderIntelCard).join('')||'<div class="empty">没有找到符合条件的文章</div>'; bindCards(); document.getElementById('page').textContent=`第 ${page} / ${totalPages} 页`;document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=totalPages; }
async function deleteIntelArticle(id,event) { event?.stopPropagation(); if(!id||!await showConfirmDialog('确定要删除这篇文章吗？',{title:'删除文章',confirmText:'确认删除'}))return; const response=await fetch(`/article-management/api/article/${id}`,{method:'DELETE'}),data=await response.json();if(!response.ok||!data.success)throw Error(data.error||data.message||'删除失败');await load(); }
async function followIntelArticle(id,event) { event?.stopPropagation();try {const response=await fetch(`/api/intel/articles/${id}/follow`,{method:'POST'}),data=await response.json();if(!response.ok||!data.success)throw Error(data.error||'关注操作失败');const button=event.currentTarget;button.classList.toggle('is-following',!!data.following);button.title=data.following?'已关注（点击取消）':'加入当前关注';}catch(error){alert(`关注操作失败：${error.message}`);} }
async function readTranslationResponse(response){const raw=await response.text();if(!raw.trim())throw Error(`翻译服务未返回内容（HTTP ${response.status}）`);try{return JSON.parse(raw)}catch(_){throw Error(`翻译服务返回格式异常（HTTP ${response.status}）`)}}
async function translateIntelCard(id,event) { event?.stopPropagation();const card=document.querySelector(`#grid [data-article-id="${id}"]`),button=event.currentTarget;if(!card||!button)return;if(card.dataset.translated==='1'){card.querySelector('[data-card-title]').innerHTML=card.dataset.originalTitle;card.querySelector('[data-card-preview]').innerHTML=card.dataset.originalPreview;card.dataset.translated='0';button.innerHTML=translationMark();return;}const original=button.innerHTML;card.dataset.originalTitle=card.querySelector('[data-card-title]').innerHTML;card.dataset.originalPreview=card.querySelector('[data-card-preview]').innerHTML;card.classList.add('is-translating');button.textContent='…';try{const response=await fetch(`/api/intel/articles/${id}/translate`,{method:'POST'}),data=await readTranslationResponse(response);if(!response.ok||!data.success)throw Error(data.error||'翻译失败');const parts=String(data.translation||'').split(/\n\s*\n/);card.querySelector('[data-card-title]').textContent=(parts[0]||data.translation).replace(/^标题[：:]/,'').trim();card.querySelector('[data-card-preview]').textContent=(parts.slice(1).join(' ')||data.translation).replace(/^内容[：:]/,'').trim();card.dataset.translated='1';button.textContent='Original';}catch(error){alert(`翻译失败：${error.message}`);button.innerHTML=original;}finally{card.classList.remove('is-translating');} }
async function viewArticle(id) { const modal=document.getElementById('articleModal');modal.classList.add('active');['modalTitle','modalDate','modalSiteName','modalDomain','modalCrawlTime'].forEach(key=>document.getElementById(key).textContent='加载中...');document.getElementById('modalTitle').innerHTML='<i class="fa fa-spinner fa-spin" style="margin-right:6px"></i>加载中...';document.getElementById('modalContent').innerHTML='<div style="display:flex;justify-content:center;padding:56px;font-size:28px;color:#0f766e"><i class="fa fa-spinner fa-spin"></i></div>';document.getElementById('articleReadingColumns').classList.remove('is-translating');document.getElementById('modalTranslation').textContent='等待翻译...';currentArticle=id;try{const response=await fetch(`/article-management/api/article/${id}`),data=await response.json();if(!response.ok||!data.success)throw Error(data.error||data.message||'文章不存在');const article=data.article||{};const keywords=article.matched_keywords||article.classification_keywords;document.getElementById('modalTitle').innerHTML=highlightText(article.title||'无标题',keywords);document.getElementById('modalUrl').href=article.url||'#';document.getElementById('modalUrl').textContent=article.url||'-';document.getElementById('modalDate').textContent=article.publish_date||'';document.getElementById('modalSiteName').textContent=article.source_url_name||'-';document.getElementById('modalDomain').textContent=article.domain||'-';document.getElementById('modalCrawlTime').textContent=article.last_crawled||'-';document.getElementById('modalContent').innerHTML=renderMarkdownContent(article.content_markdown||article.content||'暂无内容',keywords);}catch(error){document.getElementById('modalTitle').textContent='加载失败';document.getElementById('modalContent').textContent=error.message||'加载文章失败，请重试';} }
function closeArticleModal(){document.getElementById('articleModal').classList.remove('active');currentArticle=null;}
document.getElementById('modalTranslateBtn').onclick=async()=>{if(!currentArticle)return;const button=document.getElementById('modalTranslateBtn'),columns=document.getElementById('articleReadingColumns');if(columns.classList.contains('is-translating')){columns.classList.remove('is-translating');button.innerHTML=translationMark();return;}button.textContent='翻译中…';try{const response=await fetch(`/api/intel/articles/${currentArticle}/translate`,{method:'POST'}),data=await readTranslationResponse(response);if(!response.ok||!data.success)throw Error(data.error||'翻译失败');document.getElementById('modalTranslation').textContent=data.translation||'暂无译文';columns.classList.add('is-translating');button.textContent='隐藏译文';}catch(error){alert(`翻译失败：${error.message}`);button.innerHTML=translationMark();}};
document.getElementById('search').onsubmit=e=>{e.preventDefault();currentQuery=document.getElementById('q').value;page=1;load().catch(showError);};document.getElementById('prev').onclick=()=>{if(page>1){page--;load().catch(showError);}};document.getElementById('next').onclick=()=>{if(page<totalPages){page++;load().catch(showError);}};function showError(error){document.getElementById('grid').innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`;}load().catch(showError);
</script>
<script>
// —— 统一文章详情弹窗：与首页 dashboard/聚合结果同款（朗读原文/朗读译文 + EN⇄中 分段翻译）——
async function viewArticle(id) { const modal=document.getElementById('articleModal');modal.classList.add('active');document.getElementById('modalTitle').textContent='加载中...';['modalDate','modalSiteName','modalDomain','modalCrawlTime'].forEach(key=>document.getElementById(key).textContent='加载中...');document.getElementById('modalContent').textContent='正在加载文章内容...';document.getElementById('modalTranslateBtn').dataset.articleId=id;document.getElementById('modalTranslateBtn').dataset.translated='0';cancelModalTranslation();modalTranslationState=null;document.getElementById('articleReadingColumns').classList.remove('is-translating');document.getElementById('translationReadingPanel').style.display='none';document.getElementById('modalTranslation').textContent='等待翻译...';document.getElementById('translationProgress').textContent='等待翻译';document.getElementById('modalTranslateBtn').innerHTML=translationMark();currentArticle=id;try{const response=await fetch(`/article-management/api/article/${id}`),data=await response.json();if(!response.ok||!data.success)throw Error(data.error||data.message||'文章不存在');const article=data.article||{};const title=article.title||'无标题';const keywords=article.matched_keywords||article.classification_keywords;document.getElementById('modalTitle').innerHTML=highlightText(title,keywords);document.getElementById('modalUrl').href=article.url||'#';document.getElementById('modalUrl').textContent=article.url||'-';document.getElementById('modalDate').textContent=article.publish_date||'';document.getElementById('modalSiteName').textContent=article.source_url_name||'-';document.getElementById('modalDomain').textContent=article.domain||'-';document.getElementById('modalCrawlTime').textContent=article.last_crawled||'-';const kw=document.getElementById('modalKeywords');kw.innerHTML=keywordTexts(keywords).map(k=>`<span class="keyword-chip">${escapeHtml(k)}</span>`).join('')||'<span>无</span>';const content=(article.content||'暂无内容').replace(/\n{3,}/g,'\n\n');const displayContent=(article.content_markdown&&String(article.content_markdown).trim())?String(article.content_markdown):content;currentArticleRaw=String(article.raw_content||article.content||'').replace(/\n{3,}/g,'\n\n');currentArticleHasRaw=Boolean(article.raw_content&&String(article.raw_content).trim());document.getElementById('modalTranslateBtn').dataset.originalTitle=title;document.getElementById('modalTranslateBtn').dataset.originalContent=content;document.getElementById('modalContent').innerHTML=renderMarkdownContent(displayContent,keywords);if(!(article.content&&String(article.content).trim().length>=20)){if(article.dynamic_markdown){document.getElementById('modalContent').innerHTML=renderMarkdownContent(article.dynamic_markdown,keywords);}else if(String(article.url||'').startsWith('http')){injectCatConvertButton(article,keywords);}}document.getElementById('modalContentLength').textContent=`${content.length} 字符`;prewarmArticleSpeech('source');prewarmArticleSpeech('translation');}catch(error){document.getElementById('modalTitle').textContent='加载失败';document.getElementById('modalContent').textContent=error.message||'加载文章失败，请重试';}}
function closeArticleModal(){stopArticleSpeech();cancelModalTranslation();document.getElementById('articleModal').classList.remove('active');currentArticle=null;const _sBtn=document.getElementById('speakSourceBtn'),_tBtn=document.getElementById('speakTranslationBtn');if(_sBtn){_sBtn.classList.remove('is-ready','is-loading');_sBtn.disabled=false;}if(_tBtn){_tBtn.classList.remove('is-ready','is-loading');_tBtn.disabled=false;}}
let modalTranslationState=null,modalTranslationRun=0,modalTranslationAbortController=null;let activeArticleAudio=null,activeArticleAudioUrl='',articleSpeechRun=0,articleSpeechAbortController=null;const articleSpeechBlobCache=new Map();let _dlTimes=[];let _playDurs=[];
        function _adaptiveAhead(){const lat=_dlTimes.length?(_dlTimes.reduce((s,x)=>s+x.ms,0)/_dlTimes.length):0;const dur=_playDurs.length?(_playDurs.reduce((s,x)=>s+x,0)/_playDurs.length):0;if(lat<=0||dur<=0)return 3;const need=Math.ceil(lat/dur)+1;return Math.max(2,Math.min(5,need));}let currentArticleRaw='';let currentArticleHasRaw=false;
function cancelModalTranslation(){modalTranslationRun++;modalTranslationAbortController?.abort();modalTranslationAbortController=null;}
async function getTranslationPlan(id,signal){const response=await fetch(`/api/intel/articles/${id}/translation-plan`,{signal});const data=await readTranslationResponse(response);if(!response.ok||!data.success)throw Error(data.error||'无法生成翻译分段');return data;}
async function requestTranslationPart(id,body,signal){const response=await fetch(`/api/intel/articles/${id}/translate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal});const data=await readTranslationResponse(response);if(!response.ok||!data.success)throw Error(data.error||'翻译失败');return data;}
async function ensureModalPlan(id,signal){if(modalTranslationState&&modalTranslationState.articleId===Number(id))return modalTranslationState;const plan=await getTranslationPlan(id,signal),segments=plan.source_segments||[];if(!segments.length)throw Error('文章没有可朗读正文');renderSourcePlan(segments);modalTranslationState={articleId:Number(id),segments,slots:[],status:Array(segments.length).fill('source'),targetLanguage:plan.target_language};return modalTranslationState;}
function renderSourcePlan(segments){const content=document.getElementById('modalContent');content.replaceChildren();segments.forEach(segment=>{const node=document.createElement('div');node.className='translation-segment';node.dataset.segmentIndex=segment.index;node.textContent=segment.text;content.append(node);});}
function renderTranslationPlan(segments){const content=document.getElementById('modalTranslation');content.replaceChildren();return segments.map(segment=>{const node=document.createElement('div');node.className='translation-segment is-pending';node.dataset.segmentIndex=segment.index;node.textContent=`第 ${segment.index+1} 段正在等待翻译…`;content.append(node);return node;});}
function updateTranslationProgress(){const state=modalTranslationState,progress=document.getElementById('translationProgress'),b=document.getElementById('modalTranslateBtn');if(!state)return;const done=state.status.filter(value=>value==='done').length,failed=state.status.filter(value=>value==='failed').length;progress.textContent=failed?`${done}/${state.segments.length} 完成，${failed} 段待重试`:`${done}/${state.segments.length} 已完成`;b.textContent=done===state.segments.length?'Hide translation':`${done}/${state.segments.length}`;if(done===state.segments.length&&state.segments.length&&!state._prewarmed){state._prewarmed=true;prewarmArticleSpeech('translation');}}
async function translatePlanSegment(index,state,run,signal){const slot=state.slots[index];if(run!==modalTranslationRun||signal.aborted)return;state.status[index]='pending';slot.className='translation-segment is-pending translate-flow';slot.textContent=`第 ${index+1} 段正在翻译…`;updateTranslationProgress();try{const result=await requestTranslationPart(state.articleId,{scope:'full_chunk',chunk_index:index},signal);if(run!==modalTranslationRun||signal.aborted)return;slot.className='translation-segment';slot.textContent=result.translation;state.status[index]='done';}catch(error){if(run!==modalTranslationRun||signal.aborted)return;state.status[index]='failed';slot.className='translation-segment is-failed';slot.replaceChildren(document.createTextNode(`第 ${index+1} 段未完成翻译。`));const retry=document.createElement('button');retry.type='button';retry.className='retry-translation';retry.textContent='重试此段';retry.onclick=()=>translateModalArticle();slot.append(retry);}finally{if(run===modalTranslationRun&&!signal.aborted)updateTranslationProgress();}}
function showOriginalArticle(){const columns=document.getElementById('articleReadingColumns'),panel=document.getElementById('translationReadingPanel'),b=document.getElementById('showRawBtn');if(!b)return;if(columns.classList.contains('is-original')){columns.classList.remove('is-original','is-translating');panel.style.display='none';b.classList.remove('is-active');b.classList.add('is-secondary');document.getElementById('translationProgress').textContent='等待翻译';return;}cancelModalTranslation();const id=document.getElementById('modalTranslateBtn').dataset.articleId;document.getElementById('modalTranslation').textContent=currentArticleRaw||'正在获取原文…';columns.classList.remove('is-translating');columns.classList.add('is-original');panel.style.display='';b.classList.add('is-active');b.classList.remove('is-secondary');if((!currentArticleRaw||!currentArticleHasRaw)&&id){fetch(`/article-management/api/article/${id}`).then(r=>r.json()).then(d=>{const a=(d&&d.article)||{};currentArticleRaw=String(a.raw_content||a.content||'').replace(/\n{3,}/g,'\n\n');currentArticleHasRaw=Boolean(a.raw_content&&String(a.raw_content).trim());if(columns.classList.contains('is-original'))document.getElementById('modalTranslation').textContent=currentArticleHasRaw?currentArticleRaw:'该文章未保存独立聚合原文（仅精炼文），无可比对原文';}).catch(()=>{if(columns.classList.contains('is-original'))document.getElementById('modalTranslation').textContent='暂无原文';});}}
async function shareCurrentArticle(btn){const id=currentArticle;if(!id){console.warn('分享失败：缺少文章ID');return;}const url=location.origin+'/share/article/'+id;const titleNode=document.getElementById('modalTitle');const shareTitle=titleNode?(titleNode.textContent||'').trim():'';const markDone=(text)=>{if(!btn)return;const old=btn.innerHTML;btn.innerHTML='<i class="fa fa-check"></i> '+(text||'已复制');setTimeout(()=>{btn.innerHTML=old;},2000);};if(navigator.share){try{await navigator.share({title:shareTitle||document.title,text:shareTitle,url});markDone('已唤起分享');return;}catch(error){if(error&&error.name==='AbortError')return;console.warn('系统分享失败，回退复制:',error);}}try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);markDone('已复制');return;}}catch(error){console.warn('剪贴板复制失败，改用手动复制:',error);}prompt('复制以下链接分享到微信：',url);}
async function translateModalArticle(){const b=document.getElementById('modalTranslateBtn'),columns=document.getElementById('articleReadingColumns'),panel=document.getElementById('translationReadingPanel'),id=b.dataset.articleId;if(!id)return;if(columns.classList.contains('is-original')){columns.classList.remove('is-original');const _rb=document.getElementById('showRawBtn');if(_rb){_rb.classList.remove('is-active');_rb.classList.add('is-secondary');}}if(modalTranslationState&&modalTranslationState.articleId===Number(id)&&modalTranslationState.slots.length){const visible=columns.classList.toggle('is-translating');panel.style.display=visible?'':'none';b.innerHTML=visible?'Hide translation':translationMark();return;}cancelModalTranslation();const run=modalTranslationRun,controller=new AbortController();modalTranslationAbortController=controller;b.textContent='Preparing…';b.disabled=true;try{const sourceState=await ensureModalPlan(id,controller.signal),segments=sourceState.segments;if(run!==modalTranslationRun||controller.signal.aborted)return;const slots=renderTranslationPlan(segments);columns.classList.add('is-translating');panel.style.display='';const state={articleId:Number(id),segments,slots,status:Array(segments.length).fill('pending'),targetLanguage:sourceState.targetLanguage};modalTranslationState=state;updateTranslationProgress();let next=0;const worker=async()=>{while(true){const index=next++;if(index>=segments.length)return;await translatePlanSegment(index,state,run,controller.signal);}};await Promise.all(Array.from({length:Math.min(2,segments.length)},worker));}catch(error){if(run!==modalTranslationRun||controller.signal.aborted)return;document.getElementById('modalTranslation').textContent=`无法建立对照翻译：${error.message}`;columns.classList.add('is-translating');panel.style.display='';b.innerHTML=translationMark();}finally{if(modalTranslationAbortController===controller)modalTranslationAbortController=null;if(run===modalTranslationRun)b.disabled=false;}}
function setSpeechBufferState(active,done=0,total=1){const node=document.getElementById('speechBufferWave');if(!node)return;node.hidden=!active;if(active){node.style.setProperty('--speech-buffer-progress',`${Math.min(100,Math.round(done/Math.max(1,total)*100))}%`);node.lastChild.textContent=`预缓存 ${done}/${total}`;}}
function stopArticleSpeech(){articleSpeechRun++;articleSpeechAbortController?.abort();articleSpeechAbortController=null;articleSpeechBlobCache.clear();setSpeechBufferState(false);if(activeArticleAudio){activeArticleAudio.pause();activeArticleAudio=null;}if(activeArticleAudioUrl){URL.revokeObjectURL(activeArticleAudioUrl);activeArticleAudioUrl='';}document.querySelectorAll('.translation-segment.is-speaking').forEach(node=>node.classList.remove('is-speaking'));}
async function getArticleSpeechPlan(id,side){const response=await fetch(`/api/intel/articles/${id}/speech-plan?side=${encodeURIComponent(side)}`);const data=await readTranslationResponse(response);if(!response.ok||!data.success)throw Error(data.error||'无法建立朗读计划');return data;}
async function fetchArticleSpeech(id,side,index,signal){const key=`${id}:${side}:${index}`;if(!articleSpeechBlobCache.has(key)){articleSpeechBlobCache.set(key,(async()=>{const t0=performance.now();const response=await fetch(`/api/intel/articles/${id}/speech`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side,fragment_index:index}),signal});if(!response.ok){const data=await readTranslationResponse(response);throw Error(data.error||'朗读失败');}const blob=await response.blob();const ms=Math.max(1,performance.now()-t0);_dlTimes.push({bytes:blob.size,ms});if(_dlTimes.length>8)_dlTimes.shift();return blob;})());}try{return await articleSpeechBlobCache.get(key);}catch(error){articleSpeechBlobCache.delete(key);throw error;}}
async function speakArticle(side){const id=document.getElementById('modalTranslateBtn').dataset.articleId;if(!id)return;stopArticleSpeech();const run=articleSpeechRun;const controller=new AbortController();articleSpeechAbortController=controller;try{const state=await ensureModalPlan(id);if(side==='translation'&&(!state.slots.length||state.status.some(value=>value!=='done')))throw Error('请先完成全部译文后再朗读译文');const plan=await getArticleSpeechPlan(id,side),fragments=plan.fragments||[];if(!fragments.length)throw Error('文章没有可朗读正文');const prebuffer=Math.min(fragments.length,Math.max(3,_adaptiveAhead()));const queue=[];let requested=0;const keepBuffered=(until)=>{while(requested<fragments.length&&requested<until){queue[requested]=fetchArticleSpeech(id,side,requested,controller.signal);requested++;}};keepBuffered(prebuffer);setSpeechBufferState(true,0,prebuffer);await Promise.all(queue.slice(0,prebuffer).map((item,index)=>item.then(value=>{setSpeechBufferState(true,index+1,prebuffer);return value;})));setSpeechBufferState(false);for(let index=0;index<fragments.length&&run===articleSpeechRun;index++){keepBuffered(index+_adaptiveAhead()+1);const fragment=fragments[index],container=side==='translation'?document.getElementById('modalTranslation'):document.getElementById('modalContent');const node=container.querySelector(`[data-segment-index="${fragment.article_segment_index}"]`);node?.classList.add('is-speaking');node?.scrollIntoView({block:'center',behavior:'smooth'});const blob=await queue[index];if(run!==articleSpeechRun)break;const url=URL.createObjectURL(blob);activeArticleAudioUrl=url;const audio=new Audio(url);activeArticleAudio=audio;audio.preload='auto';await new Promise((resolve,reject)=>{audio.onended=()=>{if(_playDurs.length>10)_playDurs.shift();_playDurs.push((audio.duration||4)*1000);resolve();};audio.onerror=()=>reject(new Error('音频播放失败'));audio.play().catch(reject);});node?.classList.remove('is-speaking');URL.revokeObjectURL(url);activeArticleAudioUrl='';}activeArticleAudio=null;}catch(error){if(run===articleSpeechRun&&!controller.signal.aborted){stopArticleSpeech();alert(`朗读失败：${error.message}`);}}}
async function prewarmArticleSpeech(side){const id=document.getElementById('modalTranslateBtn').dataset.articleId;if(!id)return;const btn=side==='source'?document.getElementById('speakSourceBtn'):document.getElementById('speakTranslationBtn');if(btn){btn.disabled=true;btn.classList.remove('is-ready');btn.classList.add('is-loading');}try{try{await fetch(`/api/intel/articles/${id}/speech/prewarm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side,limit:6})});}catch(e){}const plan=await getArticleSpeechPlan(id,side);const fragments=plan.fragments||[];if(fragments.length){const controller=new AbortController();const prebuffer=Math.min(fragments.length,Math.max(3,_adaptiveAhead()));let i=0;const worker=async()=>{while(i<prebuffer){const idx=i++;await fetchArticleSpeech(id,side,idx,controller.signal);}};const concurrency=Math.min(2,prebuffer);await Promise.all(Array.from({length:concurrency},worker));}if(btn){btn.classList.remove('is-loading');btn.classList.add('is-ready');btn.style.display='';}}catch(e){if(btn)btn.classList.remove('is-loading');}finally{if(btn)btn.disabled=false;}}
document.getElementById('modalTranslateBtn').onclick=()=>translateModalArticle();
</script>
